syntax = "proto3";

package bonanza.browser;

import "bonanza.build/pkg/proto/model/encoding/encoding.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bonanza.build/pkg/proto/browser";

message RecentlyObservedEncoder {
  // Configuration of object encoders.
  repeated bonanza.model.encoding.BinaryEncoder configuration = 1;

  message LastObservation {
    // The time at which the encoder was last observed as part of an
    // object's payload.
    google.protobuf.Timestamp time = 1;

    // The full name of the Protobuf message type that contained the
    // encoder.
    string message_type = 2;

    // The name of the field in the Protobuf message containing the
    // encoder.
    string field_name = 3;
  }

  // If set, the encoder was stored in the payload of a recently
  // accessed object.
  LastObservation last_observation = 2;
}

message Cookie {
  // Encoders that were recently provided by the user, or were part of
  // recently accessed objects.
  repeated RecentlyObservedEncoder recently_observed_encoders = 1;

  // PCKS #8 encoded, ECDH, ECDSA or Ed25519 private keys that can be
  // used to decrypt and display actions that are being processed by the
  // scheduler.
  repeated bytes ecdh_private_keys = 2 [debug_redact = true];
}

// Encoders that are embedded in links to pages of the browser, so that
// these pages can be displayed without the user having to provide
// encoder configurations manually.
//
// Links contain these encoders in their fragment, which has the form
// "#encoders=" followed by the marshaled message, base64url encoded
// without padding. As fragments are not sent to the server as part of
// HTTP requests, the encoders do not end up in access logs. Pages
// contain a script that removes the fragment and submits its contents
// using a form field named "linked_encoders".
message LinkedEncoders {
  // Encoders that may be used to decode the objects displayed on the
  // page, and objects referenced by them. The time of last observation
  // is ignored, as the browser sets it to the time at which the link
  // was followed.
  repeated RecentlyObservedEncoder encoders = 1;
}
