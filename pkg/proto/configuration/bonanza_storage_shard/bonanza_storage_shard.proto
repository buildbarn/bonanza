syntax = "proto3";

package bonanza.configuration.bonanza_storage_shard;

import "bonanza.build/pkg/proto/configuration/storage/object/local/local.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/global/global.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/grpc/grpc.proto";
import "github.com/buildbarn/bb-storage/pkg/proto/configuration/lossymap/lossymap.proto";
import "google/protobuf/duration.proto";

option go_package = "bonanza.build/pkg/proto/configuration/bonanza_storage_shard";

message ApplicationConfiguration {
  // Common configuration options that apply to all Buildbarn binaries.
  buildbarn.configuration.global.Configuration global = 1;

  // gRPC servers to spawn to listen for requests from clients.
  repeated buildbarn.configuration.grpc.ServerConfiguration grpc_servers = 2;

  // Configuration options for writing objects to disk.
  bonanza.configuration.storage.object.local.StoreConfiguration
      local_object_store = 3;

  // Configuration for the tags map. Tags can be used to assign
  // arbitrary identifiers to objects residing in the object store.
  buildbarn.configuration.lossymap.HashMapConfiguration tags_map = 4;

  // Configuration for the leases map. The leases map is a data
  // structure that stores leases of all children of objects stored in
  // the current shard. These leases track the completeness of graphs of
  // objects, which is necessary for UploadDag() operations against the
  // storage frontend to run efficiently.
  buildbarn.configuration.lossymap.HashMapConfiguration leases_map = 5;

  // Leases of objects are timestamps. An object is guaranteed to be
  // present as long as the watermark of the cluster does not exceed its
  // lease. The time between the watermark and the current time is the
  // retention of the cluster.
  //
  // As objects may reference objects stored on other shards, leases
  // are checked against the highest watermark of all shards in the
  // cluster. A consequence is that whenever a single shard loses data
  // abruptly, leases are invalidated across the entire cluster. This
  // happens when a shard is not shut down cleanly, as its watermark is
  // then raised to the time at which it restarts, or when it fails to
  // write to its reference-location map. From then on, the leases of
  // all DAGs in use need to be renewed, and all objects contained in
  // them are rewritten by the shards holding them as they are
  // accessed. This temporarily causes a significant increase in
  // traffic, and reduces the effective capacity of the cluster, as
  // the rewritten objects displace other data. Shards should therefore
  // be shut down cleanly whenever possible.
  //
  // For the same reason, the clocks of all shards in the cluster
  // should be synchronized. Leases and watermarks received from other
  // shards are capped to the current time, preventing a shard whose
  // clock is ahead from invalidating leases beyond the current time,
  // or for longer than the skew persists. Still, a shard whose clock
  // is ahead invalidates leases handed out by other shards in
  // proportion to the skew, while a shard whose clock is behind hands
  // out leases that appear older than they are, causing them to be
  // renewed prematurely.
  //
  // To prevent DAGs from becoming incomplete while they are in use,
  // leases that are less than this fraction of the retention above the
  // watermark are renewed proactively. Objects in the local object
  // store whose leases are below this threshold are rewritten, so that
  // they get a new lease.
  //
  // Setting this lower than 0.5 means that leases are renewed less
  // frequently, reducing the amount of traffic caused by traversing
  // DAGs and rewriting objects. In exchange, DAGs that are in use are
  // more likely to become incomplete, as only a small part of the
  // retention remains by the time their leases get renewed. Clients
  // then need to upload objects that were lost again. Setting it to 0
  // disables proactive renewal entirely, meaning leases are only
  // renewed after they have expired.
  //
  // Setting this higher than 0.5 means that leases are renewed more
  // frequently, increasing the amount of traffic and the number of
  // objects that are rewritten, thereby also reducing the effective
  // capacity of the local object store, as more of it is occupied by
  // duplicate copies of objects. In exchange, the retention of DAGs
  // that are in use is longer, and they are less likely to become
  // incomplete. Values close to 1 cause objects to be renewed almost
  // continuously.
  //
  // Recommended value: 0.5
  double lease_renewal_fraction = 7;

  // The watermark of the local object store is the point in time at
  // or after which all data written to it is still present. Leases of
  // objects that are older than the watermark of the cluster are
  // considered to be invalid.
  //
  // To give other storage shards the time to learn about changes to
  // the watermark, the watermark is computed as if all data that will
  // be overwritten within the provided amount of time is already gone.
  // The amount of data that will be written is estimated based on the
  // amount of data written in the past.
  //
  // This option should be set to a value that is larger than the
  // interval at which storage frontends poll the watermark, plus the
  // time it takes to process requests.
  //
  // Recommended value: '60s'
  google.protobuf.Duration watermark_lookahead = 8;
}
