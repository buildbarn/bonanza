syntax = "proto3";

package bonanza.model.analysis;

import "bonanza.build/pkg/proto/model/command/command.proto";
import "bonanza.build/pkg/proto/model/core/core.proto";
import "bonanza.build/pkg/proto/model/encoding/encoding.proto";
import "bonanza.build/pkg/proto/model/evaluation/evaluation.proto";
import "bonanza.build/pkg/proto/model/fetch/fetch.proto";
import "bonanza.build/pkg/proto/model/filesystem/filesystem.proto";
import "bonanza.build/pkg/proto/model/starlark/starlark.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

option go_package = "bonanza.build/pkg/proto/model/analysis";

message ActionEncoders {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining action encoders"
    };
  }

  message Value {
    // Encoders that should be used when creating Action messages that
    // are processed by workers.
    repeated bonanza.model.encoding.BinaryEncoder action_encoders = 1;
  }
}

message ExecuteRequest {
  // The elliptic-curve public key that identifies the platform that
  // should be used to execute the action in PKIX, ASN.1 DER form.
  bytes platform_pkix_public_key = 1;

  // Reference to a command Action message, containing the command line
  // arguments, environment variables, and set of paths to capture.
  bonanza.model.core.DecodableReference action_reference = 2
      [(bonanza.model.core.object_format) = {
        proto_type_name:
          "bonanza.model.command.Action";
      }];

  // The timeout that the worker needs to enforce when executing the
  // action.
  google.protobuf.Duration execution_timeout = 3;
}

message AnalysisEncoders {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining analysis encoders"
    };
  }

  message Value {
    // Encoders that should be used when creating objects containing
    // data that is computed by analysis functions.
    repeated bonanza.model.encoding.BinaryEncoder analysis_encoders = 1;
  }
}

message ActionResult {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Executing action"
    };
    ExecuteRequest execute_request = 1;
  }

  message Value {
    int64 exit_code = 1;

    bonanza.model.core.DecodableReference outputs_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_type_name:
            "bonanza.model.command.Outputs";
        }];
  }
}

message BuildSpecification {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining build specification"
    };
  }

  message Value {
    message Module {
      // The name of the module for which source code is provided, without
      // the leading "@" (e.g., "rules_go").
      string name = 1;

      // Reference to the root directory of this module. The root
      // directory MUST contain a file named "MODULE.bazel". It MUST NOT
      // contain any symbolic links whose targets escape the root
      // directory (i.e., maximum_symlink_escapement_levels MUST be
      // zero).
      bonanza.model.filesystem.DirectoryReference root_directory_reference = 2;
    }

    message UseLockfile {
      // If set and any information is missing or out-of-date, the build
      // will fail with an error. This mode never changes the lockfile or
      // performs network requests during resolution. Module extensions that
      // marked themselves as reproducible may still perform network
      // requests, but are expected to always produce the same result.
      bool error = 1;

      // If set, mutable information is refreshed if its age exceeds the
      // provided amount of time.
      google.protobuf.Duration maximum_cache_duration = 2;
    }

    // Non-empty list of modules for which explicit copies of source code
    // are provided.
    repeated Module modules = 1;

    // The name of the module whose MODULE.bazel file should be treated as
    // the root for the sake of resolving dependencies. Any calls to
    // archive_override(), git_override(), multiple_version_override(), or
    // single_version_override() in MODULE.bazel files other than the one
    // belonging to the root module are ignored.
    string root_module_name = 2;

    // Parameters that the client used to create objects containing
    // Directory and Leaves messages. The server MUST also use these
    // parameters when creating output directories.
    bonanza.model.filesystem.DirectoryCreationParameters
        directory_creation_parameters = 4;

    // Parameters that the client used to create objects containing lists
    // of FileContents messages and file chunks. The server MUST also use
    // these parameters when creating output files.
    bonanza.model.filesystem.FileCreationParameters file_creation_parameters =
        5;

    // Whether or not to use the MODULE.bazel.lock file that is part of
    // the root module. If not set, the lockfile is neither checked nor
    // updated.
    UseLockfile use_lockfile = 6;

    // URLs of registries to use to locate Bazel module dependencies. The
    // order is important: modules will be looked up in earlier registries
    // first, and only fall back to later registries when they're missing
    // from the earlier ones.
    repeated string module_registry_urls = 7;

    // Whether to ignore `bazel_dep` and `use_extension` declared as
    // `dev_dependency` in the MODULE.bazel of the root module. Note that
    // such dependencies are always ignored in the MODULE.bazel file of
    // modules other than the root module.
    bool ignore_root_module_dev_dependencies = 8;

    // Names of modules containing Starlark code that needs to be
    // preloaded.
    //
    // TODO: This feature is only present to aid development, and should
    // be removed at some point.
    repeated string builtins_module_names = 9;

    // Apparent label of the platform() that should be used for executing
    // commands as part of module extensions and repository rules. The
    // label is assumed to be relative to the root package of the root
    // module.
    //
    // If this field is not set, the build will be unable to evaluate
    // module extensions and repository rules.
    string repo_platform_label = 10;

    // Encoders that should be used when creating Action and Result
    // messages that are processed and created by workers.
    repeated bonanza.model.encoding.BinaryEncoder action_encoders = 11;

    // Encoders that should be used when creating objects containing
    // data that is computed by analysis functions, such as lists of
    // targets, configured target actions and build setting overrides.
    repeated bonanza.model.encoding.BinaryEncoder analysis_encoders = 16;

    // Encoders that should be used when creating objects that are
    // part of Starlark values and compiled programs.
    repeated bonanza.model.encoding.BinaryEncoder starlark_value_encoders = 17;

    // If set, name of the Starlark function to invoke to wrap the
    // execution of rule implementation functions. This can be used to
    // decorate ctx to contain fields that are either deprecated, or
    // trivially implementable in pure Starlark.
    string rule_implementation_wrapper_identifier = 13;

    // If set, name of the Starlark function to invoke to wrap the
    // execution of subrule implementation functions. This can be used to
    // decorate subrule_ctx to contain fields that are either deprecated,
    // or trivially implementable in pure Starlark.
    string subrule_implementation_wrapper_identifier = 14;

    // If set, name of the Starlark function to invoke to wrap the
    // execution of aspect implementation functions. This can be used to
    // decorate ctx to contain fields that are either deprecated, or
    // trivially implementable in pure Starlark.
    string aspect_implementation_wrapper_identifier = 18;

    // The elliptic-curve public key that identifies the platform that
    // should be used to fetch files from module registries, module
    // sources, and through repository_ctx.download() in PKIX, ASN.1 DER
    // form.
    bytes fetch_platform_pkix_public_key = 15;
  }
}

message BuiltinsModuleNames {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining builtins module names"
    };
  }

  message Value {
    repeated string builtins_module_names = 1;
  }
}

// The outputs of targets and aspects that need to be built.
message OutputSelection {
  // Whether to build the files contained in DefaultInfo.files. As
  // aspects cannot return DefaultInfo, this field has no effect when
  // building the outputs of aspects.
  bool default_info_files = 1;

  // The names of the fields of OutputGroupInfo whose files need to be
  // built, sorted alphabetically. Output groups that are not provided
  // by a target or aspect are ignored.
  repeated string output_groups = 2;
}

message BuildResult {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Building {query}"
    };
    message BuildSettingOverride {
      // The apparent label of the build setting target.
      string label = 1;

      // The value to assign to the build setting.
      string value = 2;
    }

    message Configuration {
      // Build settings for which overrides are provided on the command
      // line. The client SHOULD NOT attempt to perform any normalization
      // (e.g., sorting or collapsing overrides using the same label), as
      // labels may be aliases and build settings may accept lists of
      // values.
      repeated BuildSettingOverride build_setting_overrides = 1;
    }

    // Configurations for which builds should take place.
    repeated Configuration configurations = 1;

    // Query expression yielding the targets that should be built.
    // Target patterns contained in the query expression MUST either be
    // canonical or be prefixed with an apparent repo name. Apparent
    // repo names are resolved from the perspective of the root module.
    //
    // Clients can use label.NewQueryFromTargetPatternArguments() to
    // convert target patterns provided on the command line (e.g.,
    // "//... -//foo/...") to a query expression.
    string query = 2;

    // Aspects to apply to the targets that should be built, in the
    // order in which they are applied, corresponding to Bazel's
    // --aspects command line flag. Aspects are of the form
    // "<label>%<name>", where the label refers to the .bzl file
    // declaring the aspect. Labels MUST either be canonical or be
    // prefixed with an apparent repo name. Apparent repo names are
    // resolved from the perspective of the root module.
    repeated string aspects = 3;

    message AspectParameter {
      // The name of the public attr of the aspects.
      string name = 1;

      // The value to assign to the attr, which is converted to the
      // type of the attr.
      string value = 2;
    }

    // Values of parameters of the aspects, corresponding to Bazel's
    // --aspects_parameters command line flag. Parameters apply to all
    // aspects that have a public attr with the same name.
    repeated AspectParameter aspect_parameters = 4;

    // The outputs of the targets and aspects to build, corresponding
    // to Bazel's --output_groups command line flag.
    OutputSelection outputs = 5;

    // The names of output groups that need to be provided by at least
    // one of the targets or aspects that are built, sorted
    // alphabetically. It is an error for these output groups to be
    // absent. This is used to implement Bazel's
    // --incompatible_fail_on_unknown_output_groups command line flag,
    // which only applies to output groups that are requested
    // explicitly.
    repeated string required_output_groups = 6;
  }

  message Value {}
}

// CanonicalRepoName resolves the canonical name of a repo, given its
// apparent name and the name of the repo which attempts to access it.
message CanonicalRepoName {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Resolving repo @{to_apparent_repo} as seen from @@{from_canonical_repo}"
    };
    // The canonical name of the repo from which the apparent repo is
    // being accessed.
    //
    // TODO: Should this be reduced to only take a module instance or
    // module extension?
    string from_canonical_repo = 1;

    // The apparent name of the repo which is being accessed.
    string to_apparent_repo = 2;
  }

  message Value {
    // The resolved canonical name of the repo which is being accessed.
    // This may be set to the empty string if no repo exists under the
    // provided apparent repo name.
    string to_canonical_repo = 1;
  }
}

message CompatibleExecutionPlatforms {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Selecting compatible execution platforms"
    };
    // The constraints that must be present on the execution platform
    // for it to be considered compatible.
    //
    // Constraints whose values correspond to the default value MUST
    // have Constraint.value set to the empty string.
    repeated Constraint constraints = 1;
  }

  message Value {
    // List of platforms that are available for executing commands that
    // match the provided set of constraints, ordered by decreasing
    // preference.
    repeated ExecutionPlatform execution_platforms = 1;
  }
}

message CompatibleToolchainsForType {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Selecting compatible toolchains of type {toolchain_type}"
    };
    // The label of the toolchain type for which toolchains are
    // requested.
    string toolchain_type = 1;

    // Platform constraints and build settings that are currently active.
    //
    // If this reference is not set, toolchains need to be selected
    // without any platform constraints and build settings in place.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }

  message Value {
    // Properties of the toolchains that were registered for the
    // requested type, listed in the order in which registration
    // occurred. An empty list is returned if no toolchains for this
    // type were registered.
    repeated RegisteredToolchain toolchains = 2;
  }
}

message CompiledBzlFile {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Compiling {label}"
    };
    // The label of the .bzl file. The label MUST include a canonical
    // repo name.
    string label = 1;

    repeated string builtins_module_names = 2;
  }

  message Value {
    bonanza.model.starlark.CompiledProgram compiled_program = 1;
  }
}

message CompiledBzlFileGlobal {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining global {identifier}"
    };
    string identifier = 1;
  }

  message Value {
    bonanza.model.starlark.Value global = 1;
  }
}

message BuildSettingOverride {
  message Leaf {
    // The canonical label of the build setting target.
    string label = 1;

    // The value that is assigned to the build setting.
    bonanza.model.starlark.Value value = 2;
  }

  message Parent {
    // Reference to an object containing additional build setting
    // overrides.
    bonanza.model.core.DecodableReference reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];

    // The label of the first build setting override contained in this
    // B-tree. This field can be used to efficiently look up build
    // setting overrides contained in the B-tree.
    string first_label = 2;
  }

  oneof level {
    // Properties of a single build setting for which an override is
    // in place.
    Leaf leaf = 1;

    // More build setting overrides are stored in another object.
    Parent parent = 2;
  }
}

message Args {
  message Parent {
    // Reference to the B-tree node containing additional arguments.
    bonanza.model.core.DecodableReference reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.Args";
        }];
  }

  message Leaf {
    message Add {
      message Parent {
        // Reference to the B-tree node containing additional
        // Args.add*() invocations.
        bonanza.model.core.DecodableReference reference = 1
            [(bonanza.model.core.object_format) = {
              proto_list_type_name:
                "bonanza.model.analysis.Args.Leaf.Add";
            }];
      }

      message Leaf {
        // If set, emit a string argument before the values.
        google.protobuf.StringValue start_with = 1;

        // Argument values. This field may only be set to a list or a
        // depset.
        bonanza.model.starlark.Value values = 2;

        // If set, values of type File that reference a directory are
        // expanded to all files recursively contained in that
        // directory.
        bool expand_directories = 3;

        // An optional function that converts each item to zero or more
        // strings, which may be further processed before appending. If
        // not set, standard conversion is performed.
        bonanza.model.starlark.Function map_each = 4;

        // Format string pattern, applied to each string returned by the
        // map_each function. The format string must have exactly one
        // "%s" placeholder.
        string format_each = 5;

        // If true, if there are no arguments derived from values to be
        // appended, then all further processing is suppressed and the
        // command line will be unchanged.
        //
        // If false, the effect depends on the style:
        //
        // - If separate, start_with and separate.terminate_with, if
        //   provided, will still be appended regardless of whether or
        //   not there are other arguments.
        //
        // - If joined, then even if there are no strings to join
        //   together, two arguments will be appended: start_with
        //   followed by an empty string (which is the logical join of
        //   zero strings).
        bool omit_if_empty = 6;

        // If set, duplicate arguments that appear after formatting are
        // removed. The first occurrence is the one that remains.
        bool uniquify = 7;

        message Separate {
          // If set, insert a string argument before each existing
          // argument, effectively doubling the number of arguments to
          // be appended at that point.
          google.protobuf.StringValue before_each = 1;

          // If set, emit a string argument after the values.
          google.protobuf.StringValue terminate_with = 2;
        }

        message Joined {
          // Delimiter used to join together the strings obtained from
          // applying map_each and format_each, in the same manner as
          // string.join().
          string join_with = 1;

          // Format string pattern applied to the joined string. The
          // format string must have exactly one "%s" placeholder.
          string format_joined = 2;
        }

        oneof style {
          // If set, the arguments were declared using Args.add_all().
          Separate separate = 8;

          // If set, the arguments were declared using Args.add_joined().
          Joined joined = 9;
        }
      }

      oneof level {
        // A single Args.add*() invocation.
        Leaf leaf = 1;

        // B-tree node containing additional Args.add*() invocations.
        Parent parent = 2;
      }
    }

    // List of Args.add*() invocations.
    repeated Add adds = 1;

    message UseParamFile {
      enum Format {
        // Each item (argument name or value) is written verbatim to the
        // param file with a newline character following it.
        MULTILINE = 0;

        // Same as MULTILINE, but the items are shell-quoted.
        SHELL = 1;

        // Same as MULTILINE, but:
        //
        // 1. only flags (beginning with '--') are written to the param
        //    file.
        // 2. the values of the flags, if any, are written on the same
        //    line with a '=' separator.
        //
        // This is the format expected by the Abseil flags library.
        FLAG_PER_LINE = 2;
      }

      // The format of the param file.
      Format format = 1;

      // A format string with a single "%s". If the args are spilled to
      // a params file then they are replaced with an argument
      // consisting of this string formatted with the path of the params
      // file.
      //
      // For example, if the args are spilled to a params file
      // "params.txt", then specifying "--file=%s" would cause the
      // action command line to contain "--file=params.txt".
      string param_file_arg = 2;

      // Whether to always spill the args to a params file. If false,
      // whether the arguments need to be spilled will be decided based
      // on system limits and argument length.
      bool use_always = 3;
    }

    // If set, spills the args to a params file, replacing them with a
    // pointer to the param file. Use when your args may be too large
    // for the system's command length limits.
    UseParamFile use_param_file = 2;
  }

  oneof level {
    // A single Args object.
    Leaf leaf = 1;

    // B-tree node containing additional Args objects.
    Parent parent = 2;
  }
}

message FilesToRunProvider {
  message Parent {
    // Reference to the B-tree node containing additional tools to be
    // placed in an action's input root.
    bonanza.model.core.DecodableReference reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.FilesToRunProvider";
        }];
  }

  message Leaf {
    // The executable to place inside the action's input root.
    bonanza.model.starlark.File executable = 1;

    // Depset of Files that need to be placed in the runfiles directory
    // of the executable.
    repeated bonanza.model.starlark.List.Element runfiles_files = 2;

    // Depset of SymlinkEntry structs that need to be placed in the
    // runfiles directory belonging to the main workspace.
    repeated bonanza.model.starlark.List.Element runfiles_symlinks = 3;

    // Depset of SymlinkEntry structs that need to be placed in the root
    // of the runfiles directory.
    repeated bonanza.model.starlark.List.Element runfiles_root_symlinks = 4;
  }

  oneof level {
    // A single tool to be placed in an action's input root.
    Leaf leaf = 1;

    // B-tree node containing additional tools to be placed in an
    // action's input root.
    Parent parent = 2;
  }
}

message TargetActionDefinition {
  // Depset of File objects of the input files of the action.
  repeated bonanza.model.starlark.List.Element inputs = 1;

  // Tools used by the action. For each of these tools, the executable
  // and a corresponding runfiles directory needs to be added to the
  // input root.
  repeated FilesToRunProvider tools = 2;

  // The elliptic-curve public key that identifies the platform that
  // should be used to execute the action in PKIX, ASN.1 DER form.
  bytes platform_pkix_public_key = 3;

  // Command line arguments of the action. Whereas ctx.actions.run()
  // takes argv[0] and argv[1:] separately, this field contains all of
  // the arguments.
  repeated Args arguments = 4;

  // Pattern of output paths that this action is expected to generate
  // when executed. Output paths are relative to the output directory of
  // the current configuration and package.
  //
  // As this pattern is intended to be directly embeddable into a
  // Command, any objects contained in the pattern should be encoded
  // using the command encoder.
  bonanza.model.command.PathPattern output_path_pattern = 5;

  // Directories that should be present in the output directory prior to
  // running the action. For example, if this action is expected to
  // write to output file "a/b.txt", the initial output directory will
  // contain an empty directory named "a".
  repeated bonanza.model.filesystem.DirectoryEntry initial_output_directory = 6;

  // Additional environments that need to be present when executing the
  // action. These have a higher precedence than the ones provided by
  // use_default_shell_env or configured on workers.
  repeated bonanza.model.command.EnvironmentVariableList.Element env = 7;

  // If set, use the default shell environment, which consists of a few
  // operating system dependent variables as well as variables set via
  // --action_env.
  bool use_default_shell_env = 8;
}

message TargetOutputDefinition {
  message StaticPackageDirectory {
    // The top level of the B-tree of the directory hierarchy.
    repeated bonanza.model.filesystem.DirectoryEntry entries = 1;
  }

  message ExpandTemplate {
    // File that contains the template for the output file's
    // contents.
    bonanza.model.starlark.File template = 1;

    // Whether the output file is executable.
    bool is_executable = 2;

    message Substitution {
      bytes needle = 1;
      bytes replacement = 2;
    }

    // Needles to search for in the template, and replacements to
    // emit at the locations where such needs are found.
    repeated Substitution substitutions = 3;
  }

  message Symlink {
    // The target of the symlink.
    bonanza.model.starlark.File target = 1;

    // If set to true, require that the target is a regular file that is
    // executable. Setting this to false does not mean the target is not
    // executable, just that no verification is done.
    bool is_executable = 2;
  }

  message Write {
    // The content of the file.
    Args.Leaf content = 1;

    // Whether the output file is executable.
    bool is_executable = 2;
  }

  oneof source {
    // Output of a command that was declared using
    // ctx.actions.run() or ctx.actions.run_shell(). The
    // identifier of the command generating the file is provided.
    bytes action_id = 2;

    // Output of template expansion performed by
    // ctx.actions.expand_template().
    ExpandTemplate expand_template = 3;

    // Output of ctx.actions.symlink(target_path=...) or
    // ctx.actions.write(content=<str>), provided in the form of a
    // directory hierarchy containing the file or symlink in question,
    // rooted at the output directory of the current package and
    // configuration.
    StaticPackageDirectory static_package_directory = 4;

    // Output of ctx.actions.symlink(target_file=...).
    Symlink symlink = 5;

    // Output of ctx.actions.write(content=<Args>).
    Write write = 6;
  }
}

// LabelAttrAspects expands the list of aspects that are provided to
// attr.label(aspects = ...), so that each aspect is preceded by the
// aspects that it requires through Aspect.Definition.requires. It also
// returns the public attrs of these aspects, which are needed to
// compute the parameters of the aspects from the attrs of the rule
// target that references targets through the label attr.
//
// This function is used instead of loading the definitions of the
// aspects directly, so that changes to other properties of the aspects
// don't cause the results of ConfiguredTarget for rule targets to be
// invalidated.
message LabelAttrAspects {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Expanding aspects {aspect_identifiers} of label attribute"
    };
    // The Starlark identifiers of the aspects, as stored in
    // Attr.LabelOptions.aspects.
    repeated string aspect_identifiers = 1;
  }

  message Value {
    message Aspect {
      // The Starlark identifier of the aspect.
      string identifier = 1;

      // The public attrs of the aspect, sorted by name. The values of
      // these attrs are taken from the attrs with the same name of the
      // rule target.
      repeated bonanza.model.starlark.NamedAttr public_attrs = 2;
    }

    // The aspects that need to be applied to the targets referenced by
    // the label attr, in the order in which they need to be applied.
    // Each aspect is preceded by the aspects that it requires.
    // Aspects occur at most once.
    repeated Aspect aspects = 1;
  }
}

// AspectChain computes properties of a list of aspects that are applied
// to a target, which ConfiguredTarget needs when applying the last
// aspect in the list. These properties only depend on the definitions
// of the aspects.
//
// This function is used instead of loading the definitions of all
// aspects directly, so that changes to other properties of the
// preceding aspects don't cause the results of ConfiguredTarget to be
// invalidated.
message AspectChain {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Computing properties of aspects {aspect_identifiers}"
    };
    // The Starlark identifiers of the aspects, in the order in which
    // they are applied. This list MUST NOT be empty, and MUST NOT
    // contain duplicates. Aspects listed in an aspect's
    // Aspect.Definition.requires MUST precede it.
    repeated string aspect_identifiers = 1;
  }

  message Value {
    // Indices of the aspects preceding the last aspect whose providers
    // are visible to the last aspect, in increasing order. These are
    // the aspects whose Aspect.Definition.provides satisfies the
    // Aspect.Definition.required_aspect_providers of the last aspect.
    repeated uint32 visible_aspect_indices = 1;

    // The aspects that propagate along a given kind of edge (e.g., the
    // attrs of a rule target), as computed from the corresponding
    // Aspect.PropagationEdges of the aspects.
    message PropagatingAspects {
      // Indices of the aspects that propagate along all edges, in
      // increasing order. These are the aspects whose
      // Aspect.PropagationEdges is set to "all", and the aspects they
      // require through Aspect.Definition.requires.
      repeated uint32 all_aspect_indices = 1;

      message Edge {
        // The name of the edge.
        string name = 1;

        // Indices of the aspects that propagate along the edge, in
        // increasing order. These are the aspects whose
        // Aspect.PropagationEdges contains the name of the edge, and
        // the aspects they require through
        // Aspect.Definition.requires. Aspects listed in
        // all_aspect_indices are omitted.
        repeated uint32 aspect_indices = 2;
      }

      // Aspects that propagate along specific edges, sorted by name. To
      // obtain the full list of aspects that propagate along an edge,
      // the aspects listed in all_aspect_indices need to be added.
      repeated Edge edges = 2;
    }

    // The aspects that propagate along the attrs of the rule target,
    // as computed from Aspect.Definition.attr_aspects.
    PropagatingAspects attr_propagating_aspects = 2;

    // The aspects that propagate to the toolchains of the rule target,
    // as computed from Aspect.Definition.toolchains_aspects. Edges are
    // named after the labels of the toolchain types.
    PropagatingAspects toolchain_propagating_aspects = 3;
  }
}

// GeneratingRuleAspects determines which aspects in a list of aspects
// set Aspect.Definition.apply_to_generating_rules. ConfiguredTarget
// uses this to determine which aspects to apply to the rule target that
// generates a predeclared output file.
//
// This function is used instead of loading the definitions of the
// aspects directly, so that changes to other properties of the aspects
// don't cause the results of ConfiguredTarget for predeclared output
// files to be invalidated.
message GeneratingRuleAspects {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Selecting aspects to apply to generating rules among {aspect_identifiers}"
    };
    // The Starlark identifiers of the aspects.
    repeated string aspect_identifiers = 1;
  }

  message Value {
    // Indices of the aspects in Key.aspect_identifiers that set
    // Aspect.Definition.apply_to_generating_rules, in increasing
    // order.
    repeated uint32 aspect_indices = 1;
  }
}

// ConfiguredTarget analyzes a target in a given configuration.
//
// If no aspects are provided, the target is analyzed by invoking the
// implementation function of its rule. Otherwise, the last aspect is
// applied to the target by invoking the aspect's implementation
// function. The implementation function is provided with the providers
// of the target with all preceding aspects applied, and ctx.
// ctx.rule.attr contains the values of the target's attrs, configured
// in the same way as when the target itself is analyzed. For attrs
// listed in the aspect's attr_aspects, the aspect is also applied to
// the targets they reference.
message ConfiguredTarget {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Analyzing {label}"
    };
    // The label of the package. The label MUST include a canonical repo
    // name, and MUST NOT include a target name if it matches the last
    // component of the package path.
    string label = 1;

    // The configuration in which the target is analyzed, and the
    // aspects that are applied to it.
    //
    // The configuration MUST be the output configuration of the
    // target's incoming edge transition, as computed by
    // TargetIncomingEdgeTransition. This means, for example, that
    // package groups and source file targets MUST be configured without
    // a configuration. Callers that obtain a configuration from a
    // dependency edge should use TargetProviders, which applies the
    // incoming edge transition. Aspects don't apply transitions to the
    // target to which they are applied. They are thus evaluated in the
    // same configuration as the target itself.
    //
    // If aspects are provided, the last aspect in the list is the one
    // whose implementation function is invoked. The preceding aspects
    // have already been applied, and their providers are visible to the
    // last aspect if it lists them in required_aspect_providers.
    // Callers SHOULD omit aspects that don't apply to the target, so
    // that identical results are not computed under different keys.
    bonanza.model.starlark.TargetVariant variant = 2;
  }

  message Value {
    // The values of the provider instances that were produced by the
    // rule if no aspects are provided, or by the last aspect otherwise,
    // sorted alphabetically by provider identifier. Provider instances
    // of the rule and preceding aspects are not included. Use
    // TargetProviders to obtain the merged set of provider instances.
    //
    // This list is empty if the last aspect does not apply to the
    // target, either because it is not a rule target, or because its
    // rule does not advertise the aspect's required providers.
    //
    // Aspects never apply to file targets. If the target is a
    // predeclared output file and the last aspect sets
    // Aspect.Definition.apply_to_generating_rules, this list instead
    // contains the provider instances that the last aspect yields when
    // applied to the rule target that generates the output file. Only
    // the aspects that set apply_to_generating_rules are applied to the
    // rule target. As predeclared output files are configured in the
    // same configuration as the rule target that generates them, the
    // rule target is configured in the same configuration.
    repeated bonanza.model.starlark.Struct provider_instances = 1;

    message Output {
      message Parent {
        // Reference to the B-tree node containing additional outputs.
        bonanza.model.core.DecodableReference reference = 1
            [(bonanza.model.core.object_format) = {
              proto_list_type_name:
                "bonanza.model.analysis.ConfiguredTarget.Value.Output";
            }];

        // The package relative path of the first output contained in
        // the B-tree that is referenced.
        string first_package_relative_path = 2;
      }

      message Leaf {
        // The package relative path of the output.
        string package_relative_path = 1;

        // The definition of the output.
        TargetOutputDefinition definition = 2;
      }

      oneof level {
        // A single output, for which properties are provided.
        Leaf leaf = 1;

        // B-tree node containing additional outputs.
        Parent parent = 2;
      }
    }

    // The output directories, files and symbolic links that the rule or
    // the last aspect declared as part of its implementation function
    // using ctx.actions.declare_{directory,file,symlink}(), or
    // predeclared using attr.output{,_list}().
    //
    // Outputs are stored in a B-tree, where entries are sorted
    // alphabetically by package relative path.
    repeated Output outputs = 2;

    message Action {
      message Parent {
        // Reference to the B-tree node containing additional actions.
        bonanza.model.core.DecodableReference reference = 1
            [(bonanza.model.core.object_format) = {
              proto_list_type_name:
                "bonanza.model.analysis.ConfiguredTarget.Value.Action";
            }];

        // The identifier of the first output contained in the B-tree
        // that is referenced.
        bytes first_id = 2;
      }

      message Leaf {
        // The identifier of the action. This identifier can be used by
        // outputs to reference the action that generates them.
        bytes id = 1;

        // The definition of the action, describing its arguments,
        // inputs and expected outputs.
        TargetActionDefinition definition = 2;
      }

      oneof level {
        // A single action, for which properties are provided.
        Leaf leaf = 1;

        // B-tree node containing additional actions.
        Parent parent = 2;
      }
    }

    repeated Action actions = 3;

    // Whether the target is a file target, being either a source file
    // or a predeclared output file. File targets are subject to
    // different rules when referenced by label attrs. For example, they
    // are not checked against the providers specified in
    // attr.label(providers = ...).
    bool is_file_target = 4;
  }
}

// The value of a label, label_keyed_string_dict or label_list attr of
// a rule or subrule, after its outgoing edge transition has been
// applied.
message ConfiguredLabelAttr {
  message Entry {
    // Key by which the output configuration is identified, as returned
    // by the outgoing edge transition.
    string key = 1;

    // Output configuration in which the dependencies need to be
    // configured.
    bonanza.model.core.DecodableReference output_configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];

    // If default_value_labels_resolved is set, the labels contained in
    // the attr's default value, resolved in the context of the output
    // configuration. These are the labels of the targets that are
    // referenced, after resolving aliases and checking visibility. If a
    // label resolves to None, the empty string is used.
    //
    // Entries correspond to the unique labels contained in the attr's
    // default value, in canonical form, sorted alphabetically. These
    // original labels are not stored, as they can be derived from the
    // attr's definition.
    repeated string resolved_labels = 3;
  }

  // The output configurations yielded by the outgoing edge transition,
  // sorted alphabetically by key. If empty, the attr's dependencies
  // should be left unconfigured.
  repeated Entry entries = 1;

  // Whether the attr's value is equal to its default value, and the
  // labels contained in the default value have been resolved. If not
  // set, the caller is responsible for obtaining the attr's value and
  // resolving any labels contained within.
  bool default_value_labels_resolved = 2;
}

// The toolchains and execution platform that were selected for an exec
// group of a rule or aspect.
message ConfiguredExecGroup {
  // Identifiers of the resolved toolchains, using the same order as the
  // toolchain types in the exec group definition. Any optional
  // toolchains that could not be resolved will have their identifier
  // set to the empty string.
  repeated string toolchain_identifiers = 1;

  // Label of the execution platform that was selected for the exec
  // group.
  string platform_label = 2;

  // The elliptic-curve public key that identifies the execution
  // platform that was selected for the exec group, in PKIX, ASN.1 DER
  // form.
  bytes platform_pkix_public_key = 3;
}

// The values of the attrs of a subrule that may be invoked by a rule or
// aspect.
message ConfiguredSubrule {
  // The Starlark identifier of the subrule.
  string identifier = 1;

  // The values of the subrule's attrs, using the same order as the
  // attrs in the subrule definition. As subrule attrs are always
  // private and cannot use user-defined transitions, the labels
  // contained in these attrs are always resolved.
  repeated ConfiguredLabelAttr attrs = 2;
}

// IndexedConfiguredLabelAttr is the value of a label attr of a rule,
// as computed by ConfiguredRule or ConfiguredRuleUsage. These are
// stored in sparse lists, only containing entries for attrs whose value
// could be computed.
message IndexedConfiguredLabelAttr {
  // The index of the attr in the attrs of the rule definition. Indices
  // count all attrs, not just label attrs.
  uint32 attr_index = 1;

  // The value of the attr after applying its outgoing edge transition.
  ConfiguredLabelAttr configured = 2;
}

// ConfiguredRule contains properties of a rule that only depend on the
// rule definition and the configuration in which it is evaluated, but
// not on the values of any of its public attrs. These properties are
// shared by all targets of the same rule that are configured in the
// same configuration.
message ConfiguredRule {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Configuring rule {identifier}"
    };
    // The Starlark identifier of the rule.
    string identifier = 1;

    // The configuration in which the rule is evaluated, after any
    // incoming edge transition has been applied.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }

  message Value {
    // Exec groups of the rule, using the same order as the exec groups
    // in the rule definition.
    repeated ConfiguredExecGroup exec_groups = 1;

    // All subrules that may be invoked by the rule, either directly
    // or through other subrules, sorted alphabetically by identifier.
    repeated ConfiguredSubrule subrules = 2;

    // The values of label attrs whose outgoing edge transition does
    // not read the values of public attrs, sorted by attr index.
    // Transitions that do read the values of public attrs need to be
    // applied by ConfiguredRuleUsage or the target.
    //
    // For private attrs, the labels contained in the default value are
    // resolved as well. For public attrs, they are not, as the default
    // value may not be used by any targets. For targets that leave a
    // public attr unset, ConfiguredRuleUsage.Value.label_attrs
    // contains an entry for the same attr in which the labels are
    // resolved. That entry takes precedence over the one in this list.
    repeated IndexedConfiguredLabelAttr label_attrs = 3;
  }
}

// ConfiguredRuleUsage contains properties of a rule that only depend on
// the rule definition, the configuration in which it is evaluated, and
// the set of public attrs that are explicitly set by a target. Targets
// that leave the same set of public attrs at their default values can
// share these properties.
//
// This function only computes properties that ConfiguredRule can't
// compute: outgoing edge transitions that read the values of public
// attrs that are left at their default values, and the labels contained
// in the default values of public attrs that are left unset. If
// neither applies to a target, it does not need to use this function.
message ConfiguredRuleUsage {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Configuring usage of rule {identifier}"
    };
    // The Starlark identifier of the rule.
    string identifier = 1;

    // The configuration in which the target is analyzed, after the
    // rule's incoming edge transition has been applied.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];

    // Indices of public attrs in the rule definition that are
    // explicitly set by the target. Indices only count public attrs,
    // meaning that index zero corresponds to the first attr in the
    // rule definition whose name does not start with an underscore.
    // Indices MUST be sorted in strictly increasing order.
    //
    // A public attr is considered to be set explicitly if its value
    // either uses select() or is not None.
    //
    // If none of the rule's label attrs use user-defined transitions,
    // only the indices of public label attrs that have a default value
    // other than None need to be provided, as the explicitness of
    // other attrs does not affect the value. This permits more targets
    // to share the same value.
    repeated uint32 explicit_public_attr_indices = 3;
  }

  message Value {
    // The values of label attrs that depend on which public attrs are
    // explicitly set, sorted by attr index. Entries are present for:
    //
    // - Public attrs whose outgoing edge transition was applied by
    //   ConfiguredRule, but which are left unset. These contain the
    //   same configurations as the entry in
    //   ConfiguredRule.Value.label_attrs, but also have the labels in
    //   the default value resolved. These entries take precedence over
    //   the ones in ConfiguredRule.Value.label_attrs.
    //
    // - Attrs whose outgoing edge transition reads the values of public
    //   attrs, but none that are explicitly set. These don't have an
    //   entry in ConfiguredRule.Value.label_attrs.
    //
    // Attrs whose outgoing edge transition reads the values of public
    // attrs that are explicitly set are absent from both lists. Their
    // transition needs to be applied by the target.
    repeated IndexedConfiguredLabelAttr label_attrs = 1;
  }
}

// ConfiguredAspect contains properties of an aspect that only depend on
// the aspect definition and the configuration in which it is applied.
// These are shared by all targets to which the aspect is applied in the
// same configuration.
//
// As public attrs of aspects are parameters that cannot be labels, and
// label attrs of aspects cannot use user-defined transitions, there is
// no need for an equivalent of ConfiguredRuleUsage.
message ConfiguredAspect {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Configuring aspect {identifier}"
    };
    // The Starlark identifier of the aspect.
    string identifier = 1;

    // The configuration in which the aspect is applied. This is the
    // configuration of the target to which it is applied, after the
    // target's incoming edge transition has been applied.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }

  message Value {
    // Exec groups of the aspect, using the same order as the exec
    // groups in the aspect definition.
    repeated ConfiguredExecGroup exec_groups = 1;

    // All subrules that may be invoked by the aspect, either directly
    // or through other subrules, sorted alphabetically by identifier.
    repeated ConfiguredSubrule subrules = 2;

    // The values of the aspect's private label attrs, sorted by attr
    // index. As these always use their default value, the labels
    // contained in them are always resolved.
    repeated IndexedConfiguredLabelAttr label_attrs = 3;
  }
}

// RuleUsageIncomingEdgeTransition applies the incoming edge transition of a
// rule, for all targets of the rule that explicitly set the same public
// attrs. The transition can only be applied if it does not read the
// values of any attrs that are explicitly set.
message RuleUsageIncomingEdgeTransition {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Applying incoming edge transition of rule {identifier}"
    };
    // The Starlark identifier of the rule.
    string identifier = 1;

    // The configuration in which the target is requested.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];

    // Indices of public attrs in the rule definition that are
    // explicitly set by the target, using the same format as
    // ConfiguredRuleUsage.Key.explicit_public_attr_indices.
    repeated uint32 explicit_public_attr_indices = 3;
  }

  message Value {
    oneof result {
      // The configuration yielded by the incoming edge transition. If
      // the rule does not have an incoming edge transition, this is
      // equal to the configuration provided in the key.
      bonanza.model.core.DecodableReference output_configuration_reference = 1
          [(bonanza.model.core.object_format) = {
            proto_list_type_name:
              "bonanza.model.analysis.BuildSettingOverride";
          }];

      // The incoming edge transition reads the values of attrs that are
      // explicitly set. The caller needs to apply the incoming edge
      // transition for each target individually.
      google.protobuf.Empty depends_on_explicit_attrs = 2;
    }
  }
}

// TargetIncomingEdgeTransition applies the incoming edge transition of
// a target to the configuration in which it is requested. The output
// configuration is the configuration in which the target is analyzed.
//
// Only rule targets can have user-defined incoming edge transitions.
// Other kinds of targets have built-in incoming edge transitions:
//
// - Rule targets use the incoming edge transition of the target's
//   rule. It is applied through RuleUsageIncomingEdgeTransition if
//   possible, so that it can be shared with other targets of the same
//   rule.
//
// - Predeclared output file targets use the incoming edge transition
//   of the rule target that owns the output file, so that they are
//   analyzed in the same configuration as their owner.
//
// - Package groups and source file targets don't depend on the
//   configuration. They use a transition to the empty configuration,
//   so that they are only analyzed once.
//
// - All other targets currently use an identity transition.
message TargetIncomingEdgeTransition {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Applying incoming edge transition of {label}"
    };
    // The label of the target.
    string label = 1;

    // The configuration in which the target is requested.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }

  message Value {
    // The configuration yielded by the incoming edge transition, in
    // which the target is analyzed.
    bonanza.model.core.DecodableReference output_configuration_reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }
}

message TargetOutput {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining output {package_relative_path} of {label}"
    };
    // The label of the package. The label MUST include a canonical repo
    // name, and MUST NOT include a target name if it matches the last
    // component of the package path.
    string label = 1;

    // The configuration in which the target is analyzed, and the
    // aspects that are applied to it, as stored in
    // bonanza.model.starlark.File.Owner.variant. If aspects are
    // provided, the output is declared by the last aspect.
    bonanza.model.starlark.TargetVariant variant = 2;

    string package_relative_path = 3;
  }

  message Value {
    TargetOutputDefinition definition = 1;
  }
}

message DirectoryAccessParameters {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining directory access parameters"
    };
  }

  message Value {
    bonanza.model.filesystem.DirectoryAccessParameters
        directory_access_parameters = 1;
  }
}

message DirectoryCreationParameters {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining directory creation parameters"
    };
  }

  message Value {
    bonanza.model.filesystem.DirectoryCreationParameters
        directory_creation_parameters = 1;
  }
}

message EmptyDefaultInfo {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Creating empty DefaultInfo"
    };
  }

  message Value {
    // An instance of DefaultInfo that has all of its fields set to
    // their default values.
    bonanza.model.starlark.Struct default_info = 1;
  }
}

message ExecTransition {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Applying exec transition to platform {platform_label}"
    };
    // The label of the platform that was resolved for the exec group
    // referenced by the attribute.
    string platform_label = 1;

    // The configuration from which inputs need to be sourced.
    bonanza.model.core.DecodableReference input_configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }

  message Value {
    // The configuration that should be used to configure the attribute
    // that has cfg = "exec" or cfg = exec_group(...).
    bonanza.model.core.DecodableReference output_configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }
}

message FileAccessParameters {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining file access parameters"
    };
  }

  message Value {
    bonanza.model.filesystem.FileAccessParameters file_access_parameters = 1;
  }
}

message FileCreationParameters {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining file creation parameters"
    };
  }

  message Value {
    bonanza.model.filesystem.FileCreationParameters file_creation_parameters =
        1;
  }
}

message FileProperties {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining properties of {path} in @@{canonical_repo}"
    };
    // The canonical name of the repo that contains the file whose
    // properties are being requested.
    string canonical_repo = 1;

    // Path of the files whose properties are being requested, relative
    // to the root of the repo. The path MUST NOT contain "." or ".."
    // components. It also MUST NOT contain leading, trailing, or
    // redundant slashes.
    string path = 2;
  }

  message Value {
    // If set, the file exists, and its properties are provided.
    bonanza.model.filesystem.FileProperties exists = 1;
  }
}

enum DirectoryLayout {
  // Failed to provide a directory layout.
  UNKNOWN = 0;

  // Name source files "external/${repo}/${path}" and output files
  // "bazel-out/${configuration}/bin/external/${repo}/${path}". This
  // layout can be used to construct action input roots.
  INPUT_ROOT = 1;

  // Name source files and output files "${repo}/${path}". This layout
  // can be used to construct runfiles directories.
  RUNFILES = 2;
}

message FileRoot {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining root of {file.label}"
    };
    // The source file or output file's contents that are being requested.
    bonanza.model.starlark.File file = 1;

    // The desired naming scheme of files in the resulting root directory.
    DirectoryLayout directory_layout = 2;
  }

  message Value {
    // A directory hierarchy that contains the requested file, placed at
    // the location it would appear inside the input root of an action
    // that depends on it, or inside a runfiles directory of a tool that
    // depends on it.
    //
    // If the requested file is a symlink, its target(s) will also be
    // part of the directory structure.
    repeated bonanza.model.filesystem.DirectoryEntry root_directory = 1;
  }
}

message FilesInPackage {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing files in {package}"
    };
    // The package for which the list of files it contains is requested.
    string package = 1;
  }

  message Value {
    // Directory of the package, with child directories removed that
    // belong to nested packages. Furthermore, file contents are
    // removed, thereby making all files empty.
    repeated bonanza.model.filesystem.DirectoryEntry directory = 1;
  }
}

message FilesRoot {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining root of files"
    };
    // Reference to a Starlark list containing files.
    bonanza.model.core.DecodableReference list_reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.starlark.List.Element";
        }];

    // The desired naming scheme of files in the resulting root directory.
    DirectoryLayout directory_layout = 2;
  }

  message Value {
    // A directory hierarchy that contains all of the files contained in
    // the list, placed at the location they would appear inside the
    // input root of an action that depends on them, or inside a
    // runfiles directory of a tool that depends on them.
    repeated bonanza.model.filesystem.DirectoryEntry root_directory = 1;
  }
}

message Glob {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Expanding glob in {package}"
    };
    // The package in which the call to glob() is made.
    string package = 1;

    // A nondeterministic finite automaton (NFA) that describes the
    // paths to match. The NFA is encoded as a sequence of states, where
    // each state has the following format:
    //
    // - A variable length integer, which can be interpreted as follows:
    //
    //   - Bits 0 and 1: If set to zero, the current state is not an end
    //     state. If set to one, the current state is an end state and
    //     the parsed string is a match. If set to two, the current
    //     state is an end state and the parsed string is not a match.
    //     When parsing completes while in multiple states, the highest
    //     value takes precedence.
    //
    //     States for wildcard "**/" cannot be an end state.
    //
    //   - Bit 2: If set, the current state has an outgoing edge for
    //     wildcard "*". This bit cannot be set if the current state
    //     already corresponds to wildcard "*".
    //
    //   - Bit 3: If set, the current state has an outgoing edge for
    //     wildcard "**/". This bit can only be set as part of the
    //     initial state, or if the current state corresponds to regular
    //     character "/".
    //
    //   - Bits 4 and above: The number of outgoing edges the current
    //     state has for regular (non-wildcard) characters.
    //
    // - A sequence of UTF-8 encoded characters, corresponding to the
    //   characters assigned to the outgoing edges of the current state.
    //   These characters must be provided in sorted order.
    //
    // States are stored in the order in which they are referenced by
    // their parent (i.e., "*" followed by "**/" followed by regular
    // characters), breadth first.
    bytes pattern = 2;

    // Whether or not to include paths in the results that correspond to
    // directories.
    bool include_directories = 3;
  }

  message Value {
    // Set of relative paths below the package's directory that are
    // matched by one or more of the include patterns and none of the
    // exclude patterns.
    //
    // Paths are sorted alphabetically, with the '/' character having no
    // special meaning.
    repeated string matched_paths = 1;
  }
}

message HttpFetchOptions {
  // The URL of the file to fetch.
  bonanza.model.fetch.Target target = 1;

  // Optional checksum of the file to download, provided in the
  // If not set, let the function fail if the server returns a HTTP
  // status code other than 200 and 404.
  bool allow_fail = 2;
}

message HttpArchiveContents {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Downloading and extracting {fetch_options.target.urls}"
    };
    // URLs and options for determining how to fetch the file.
    HttpFetchOptions fetch_options = 1;

    enum Format {
      // The format of the archive is not specified.
      UNKNOWN = 0;

      // Gzip compressed tarball.
      TAR_GZ = 1;

      // XZ compressed tarball.
      TAR_XZ = 2;

      // ZIP archive, using the file format documented at
      // https://support.pkware.com/pkzip/appnote.
      ZIP = 3;
    }

    // The format of the archive.
    Format format = 2;
  }

  message Value {
    message Exists {
      // The contents of the archive.
      //
      // The directory hierarchy MUST NOT contain any symbolic links
      // whose targets escape the root directory (i.e.,
      // maximum_symlink_escapement_levels MUST be zero).
      bonanza.model.filesystem.DirectoryReference contents = 1;

      // A SHA-256 hash of the archive that was downloaded. This field
      // is only set if no integrity was provided as part of
      // fetch_options.
      bytes sha256 = 2;
    }

    // If set, the archive was fetched and extracted successfully. If
    // not set, fetching the file failed with a non-200 HTTP status
    // code.
    Exists exists = 1;
  }
}

message HttpFileContents {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Downloading {fetch_options.target.urls}"
    };
    // URLs and options for determining how to fetch the file.
    HttpFetchOptions fetch_options = 1;
  }

  message Progress {
    option (bonanza.model.evaluation.progress_description) = {
      template: "{downloaded}"
    };

    // The number of bytes of the file that have been downloaded.
    bonanza.model.evaluation.ProgressCounter downloaded = 1;
  }

  message Value {
    // If set, the file was fetched successfully. If not set, fetching
    // the file failed with a non-200 HTTP status code.
    bonanza.model.fetch.Result.Success exists = 1;
  }
}

message MacroExpansionContext {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining expansion context of macro {macro_instance_name} in {package}"
    };
    // The name of the package in which the macro instance is declared.
    // The package name MUST include a canonical repo name.
    string package = 1;

    // The name of the macro instance, using the same format as
    // Package.Key.macro_instance_name. This list MUST NOT be empty.
    repeated string macro_instance_name = 2;
  }

  message Value {
    // The information that is needed to expand the macro instance,
    // containing the arguments with which the macro was invoked, and
    // the names in its namespace that are referenced or declared
    // outside of it.
    //
    // Expanding a macro instance only depends on this value, as
    // opposed to the declarations of the package or macro instance in
    // which it is declared. This ensures that changes to these
    // declarations that don't affect the macro instance don't cause it
    // to be expanded again.
    bonanza.model.starlark.MacroExpansionContext.Definition definition = 1;
  }
}

message ModuleDotBazelContents {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Loading MODULE.bazel of {module_instance}"
    };
    // The module instance whose MODULE.bazel file needs to be obtained.
    string module_instance = 1;
  }

  message Value {
    // The contents of the module instance's MODULE.bazel file, if the
    // file was non-empty.
    bonanza.model.filesystem.FileContents contents = 1;
  }
}

message ModuleRegistryUrls {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining module registry URLs"
    };
  }

  message Value {
    // URLs of registries from which modules may be downloaded.
    repeated string registry_urls = 1;
  }
}

message ModuleRepoMapping {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Computing repo mapping of {module_instance}"
    };
    // The module instance for which a mapping of repos needs to be
    // computed.
    string module_instance = 1;
  }

  message Value {
    message Mapping {
      // The name of the apparent repo that is visible from within the
      // module.
      string from_apparent_repo = 1;

      // The name of the canonical repo to which the apparent repo
      // maps.
      string to_canonical_repo = 2;
    }

    // The list of repos that can be accessed from within this module
    // instance, sorted alphabetically by apparent repo.
    repeated Mapping mappings = 1;
  }
}

message ModuleExtensionRepo {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining repo @@{canonical_repo} from module extension"
    };
    string canonical_repo = 1;
  }

  message Value {
    bonanza.model.starlark.Repo.Definition definition = 1;
  }
}

message ModuleExtensionRepoNames {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing repos of module extension {module_extension}"
    };
    // Name of the module extension for which the names of the repos it
    // declares should be computed.
    string module_extension = 1;
  }

  message Value {
    // Names of repos declared by the module extensions, sorted by name.
    repeated string repo_names = 1;
  }
}

message ModuleExtensionRepos {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Evaluating module extension {module_extension}"
    };
    string module_extension = 1;
  }

  message Value {
    message Repo {
      message Parent {
        // Reference to an object with a list of Repo messages that
        // contains properties of repos in the module extension.
        bonanza.model.core.DecodableReference reference = 1
            [(bonanza.model.core.object_format) = {
              proto_list_type_name:
                "bonanza.model.analysis.ModuleExtensionRepos.Value.Repo";
            }];

        // The name of the first repo contained in this B-tree.
        // This field can be used to efficiently look up repos
        // contained in the B-tree.
        string first_name = 2;
      }

      oneof level {
        // Properties of a single repo.
        bonanza.model.starlark.Repo leaf = 1;

        // More repos are stored in another object.
        Parent parent = 2;
      }
    }

    // Successfully executed the module extension's implementation
    // function, and extracted the repos declared by it.
    repeated Repo repos = 1;
  }
}

message BuildListModule {
  // The name of the module.
  string name = 1;

  message Definition {
    // The version of the module.
    string version = 1;

    // The URL of the registry in which the module was found.
    string registry_url = 2;
  }

  // Properties of the module that are needed to download it from the
  // registry.
  Definition definition = 2;
}

message ModuleFinalBuildList {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Computing final module build list"
    };
  }

  message Value {
    // Modules that were referenced by the main module, or one of
    // transitive dependencies, sorted by name and version.
    repeated BuildListModule build_list = 1;
  }
}

message FinalBuildListModuleDefinition {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining definition of module {module_name}"
    };
    // The name of the module, without the leading "@" (e.g.,
    // "rules_go").
    string module_name = 1;
  }

  message Value {
    // The definition of the module in the final build list, if the
    // module is part of the final build list. If not set, the module
    // is not part of the final build list.
    //
    // This is provided on a per-module basis, so that changes to the
    // versions of other modules don't affect the repo of this module.
    BuildListModule.Definition definition = 1;
  }
}

message ModuleRoughBuildList {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Resolving module dependencies"
    };
  }

  message Value {
    repeated BuildListModule build_list = 1;
  }
}

message OverridesListModule {
  // Name of the module.
  string name = 1;

  // If multiple_version_override() is called, a sorted list of
  // version numbers that are permitted to coexist.
  repeated string versions = 2;
}

message ModuleWithLocalOverrideRootDirectory {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining root directory of locally overridden module {module_name}"
    };
    // The name of the module, without the leading "@" (e.g.,
    // "rules_go").
    string module_name = 1;
  }

  message Value {
    // Reference to the root directory of the module, if the client
    // provided an explicit copy of its source code as part of the build
    // specification. If not set, no such copy was provided.
    //
    // This is provided on a per-module basis, so that changes to the
    // source code of one module don't affect the repos of others.
    bonanza.model.filesystem.DirectoryReference root_directory_reference = 1;
  }
}

message ModulesWithLocalOverrides {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing modules with local overrides"
    };
  }

  message Value {
    // Alphabetically sorted list of names of modules for which the
    // client provided explicit copies of source code as part of the
    // build specification.
    //
    // This value intentionally only contains the names of these
    // modules, and not the references to their root directories. This
    // ensures that this value remains stable when the contents of
    // these modules change.
    repeated string module_names = 1;
  }
}

message ModulesWithMultipleVersions {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing modules with multiple versions"
    };
  }

  message Value {
    // Alphabetically sorted list of modules for which overrides are
    // in place. For these modules, computation of the rough build
    // list may assume that sources can be accessed directly, without
    // needing to separately load a MODULE.bazel file from Bazel
    // Central Registry (BCR).
    repeated OverridesListModule overrides_list = 1;
  }
}

message ModulesWithOverrides {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing modules with overrides"
    };
  }

  message Value {
    // Alphabetically sorted list of modules for which overrides are
    // in place. For these modules, computation of the rough build
    // list may assume that sources can be accessed directly, without
    // needing to separately load a MODULE.bazel file from Bazel
    // Central Registry (BCR).
    repeated OverridesListModule overrides_list = 1;
  }
}

message ModuleOverride {
  // Name of the module.
  string name = 1;

  message SingleVersion {
    // Version of the module to use.
    string version = 1;

    // Registry to pull the version from.
    string registry = 2;

    // Patch labels are not sorted as they are applied in order.
    repeated string patch_labels = 4;

    // Patch commands are not sorted as they are applied in order.
    repeated string patch_commands = 5;

    // Strip is the same as the -p argument of Unix patch.
    int64 patch_strip = 6;
  }

  message MultipleVersions {
    // Versions is a list of sorted versions allowed to explicitly coexist.
    repeated string versions = 1;

    // Registry to pull the versions from.
    string registry = 2;
  }

  message Definition {
    // Kind of the override for the module name.
    oneof kind {
      // See:
      // https://bazel.build/rules/lib/globals/module#single_version_override
      SingleVersion single_version = 1;

      // See:
      // https://bazel.build/rules/lib/globals/module#multiple_version_override
      MultipleVersions multiple_versions = 2;

      // Repository rule is the definition for the rule.
      // See: https://bazel.build/rules/lib/globals/module#archive_override
      // See: https://bazel.build/rules/lib/globals/module#git_override
      bonanza.model.starlark.Repo.Definition repository_rule = 3;
    }
  }

  // The override that is declared for the module.
  Definition definition = 2;
}

message ModulesWithRemoteOverrides {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing modules with remote overrides"
    };
  }

  message Value {
    // Alphabetically sorted list of modules for which remote overrides are in
    // place.
    repeated ModuleOverride module_overrides = 1;
  }
}

message ModuleOverrideDefinition {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining override of module {module_name}"
    };
    // The name of the module, without the leading "@" (e.g.,
    // "rules_go").
    string module_name = 1;
  }

  message Value {
    // The override that the root module's MODULE.bazel file declares
    // for the module. If not set, no such override is declared.
    //
    // This is provided on a per-module basis, so that changes to the
    // overrides of other modules don't affect the repo of this module.
    ModuleOverride.Definition definition = 1;
  }
}

message Package {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Loading package {label}"
    };
    // The label of the package. The label MUST include a canonical repo
    // name, and MUST NOT include a target name.
    string label = 1;

    // If empty, obtain the targets and macro instances declared at the
    // top level of the package, by evaluating its BUILD.bazel file.
    // Otherwise, obtain the targets and macro instances declared by a
    // macro instance, by invoking the implementation function of the
    // macro.
    //
    // The name of the macro instance is equal to the concatenation of
    // all elements. Each element is the name suffix of a macro
    // expansion context, as stored in MacroExpansionContext.name_suffix,
    // starting at the top level of the package. This identifies the
    // chain of macro instances whose namespaces contain the macro
    // instance.
    repeated string macro_instance_name = 2;
  }

  message Value {
    message Target {
      message Parent {
        // Reference to an object with a list of Target messages that
        // contain properties of targets in the package.
        bonanza.model.core.DecodableReference reference = 1
            [(bonanza.model.core.object_format) = {
              proto_list_type_name:
                "bonanza.model.analysis.Package.Value.Target";
            }];

        // The name of the first target contained in this B-tree.
        // This field can be used to efficiently look up targets
        // contained in the B-tree.
        string first_name = 2;

        // The name of the last target contained in this B-tree.
        // This field can be used to efficiently merge B-trees of
        // targets, as is done by PackageTargets.
        string last_name = 3;
      }

      oneof level {
        // Properties of a single target.
        bonanza.model.starlark.Target leaf = 1;

        // More targets are stored in another object.
        Parent parent = 2;
      }
    }

    // The targets declared at the top level of the package or by the
    // macro instance, sorted by name.
    repeated Target targets = 1;

    // Contexts for expanding the macro instances declared at the top
    // level of the package or by the macro instance. Macro instances
    // whose namespace is contained within the namespace of another
    // macro instance are stored in the context of the latter, meaning
    // that the namespaces of the macro instances in this list are
    // disjoint. The targets and macro instances declared by these
    // macro instances are obtained by requesting the Package key with
    // macro_instance_name set.
    //
    // Macro instances have a namespace that is separate from that of
    // targets. A target may therefore have the same name as a macro
    // instance.
    repeated bonanza.model.starlark.MacroExpansionContext.Entry
        macro_expansion_contexts = 2;
  }
}

message PackageGroupContains {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Checking whether {package_group_label} contains {package}"
    };
    // The canonical label of the package group target.
    string package_group_label = 1;

    // The canonical name of the package to look up within the package
    // group.
    string package = 2;
  }

  message Value {
    // If set, the package is part of the package group.
    bool contains = 1;
  }
}

// PackageTargets returns the targets in a package after all macro
// instances have been expanded. Unlike the value of Package, the
// resulting list only contains targets.
message PackageTargets {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing targets in {package}"
    };
    // The name of the package. The package name MUST include a
    // canonical repo name.
    string package = 1;

    // If empty, obtain all targets in the package. Otherwise, obtain
    // all targets declared by a macro instance, either directly or
    // through the macro instances it declares. The name of the macro
    // instance uses the same format as Package.Key.macro_instance_name.
    repeated string macro_instance_name = 2;

    // If set, omit targets declared by finalizers, either directly or
    // through the macro instances they declare. This yields the
    // targets that finalizers may observe.
    bool exclude_finalizers = 3;
  }

  message Value {
    // The targets in the package or macro instance, sorted by name.
    repeated Package.Value.Target targets = 1;
  }
}

message PackagesAtAndBelow {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing packages at and below {base_package}"
    };
    // Repo and package prefix at which the lookup should start.
    string base_package = 1;

    // Only return packages below the base package whose relative path
    // is matched by a nondeterministic finite automaton (NFA). The NFA
    // uses the same encoding as Glob.Key.pattern. Directories are not
    // traversed if none of the remaining states of the NFA can yield a
    // match.
    //
    // Recursive target patterns use pattern "**" to obtain all
    // packages, while native.subpackages() uses the patterns provided
    // by the caller.
    bytes pattern = 2;
  }

  message Value {
    // If set, the directory corresponding to the base package contains
    // a BUILD.bazel or BUILD file.
    bool package_at_base_package = 1;

    // List of relative paths that can be appended to the base package
    // to obtain packages below the base package containing a
    // BUILD.bazel or BUILD file. Paths are sorted lexicographically by
    // their components.
    repeated string packages_below_base_package = 2;
  }
}

// QueryExpansion evaluates a query expression, as done by "bazel
// query", and returns the labels of the targets yielded by it. As any
// target pattern is also a valid query expression, this is also used
// to expand target patterns (e.g., as part of "bazel build").
//
// Operands of the query expression are evaluated using separate keys,
// so that their results can be reused. Recursive target patterns are
// expanded by evaluating the target pattern for each subpackage
// separately.
message QueryExpansion {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Expanding query {query}"
    };
    // The query expression to evaluate, in normal form. All target
    // patterns contained in the query expression MUST be canonical.
    //
    // As is the case for "bazel query", target patterns containing
    // wildcards match targets that have tag "manual". Commands like
    // "bazel build" exclude these targets by rewriting target
    // patterns to queries of shape "p - tag(manual, p)".
    string query = 1;

    // Whether to follow dependencies on targets that are not
    // explicitly declared in BUILD files, such as ones that are
    // introduced by private attributes and attribute default values.
    // This MUST NOT be set if the query expression does not follow
    // any dependencies, as it does not affect the results.
    bool include_implicit_deps = 2;
  }

  message Value {
    // Canonical labels of the targets yielded by the query expression.
    repeated TargetLabel target_labels = 1;
  }
}

// QueryResult evaluates a query expression, as done by "bazel query",
// and returns the targets yielded by it. As opposed to QueryExpansion,
// the query expression may contain apparent target patterns, and the
// definitions of the targets are returned as well, so that clients can
// display them. Target patterns containing wildcards match targets
// having tag "manual".
//
// Definitions of targets are obtained by requesting QueryTargets for
// each object of the B-tree of labels returned by QueryExpansion, so
// that results can be reused if the query yields different targets.
message QueryResult {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Evaluating query {query}"
    };
    // The query expression to evaluate. Target patterns contained in
    // the query expression MUST either be canonical or be prefixed with
    // an apparent repo name. Apparent repo names are resolved from the
    // perspective of the root module.
    string query = 1;

    // Whether to follow dependencies on targets that are not
    // explicitly declared in BUILD files, such as ones that are
    // introduced by private attributes and attribute default values.
    bool include_implicit_deps = 2;

    // The amount of detail with which definitions of targets should
    // be returned. Returning less detail significantly reduces the
    // size of the results.
    QueryTarget.DefinitionDetail definition_detail = 3;
  }

  message Value {
    // Targets yielded by the query expression, in the order defined by
    // label.CanonicalLabel.Compare().
    repeated QueryTarget targets = 1;
  }
}

// QueryTarget is an element of a B-tree containing targets yielded by
// a query expression, as returned by QueryResult and QueryTargets.
message QueryTarget {
  // The amount of detail with which definitions of targets are
  // returned.
  enum DefinitionDetail {
    // Don't return definitions of targets, only their labels. This
    // suffices for displaying the results of queries as a list of
    // labels or packages.
    NONE = 0;

    // Only return the parts of the definitions of targets that are
    // needed to determine their kind (e.g., "cc_library rule" or
    // "source file"). This suffices for displaying the results of
    // queries as a list of labels and kinds.
    KIND = 1;

    // Return the full definitions of targets.
    FULL = 2;
  }

  message Leaf {
    // The canonical label of the target.
    string label = 1;

    // The definition of the target, containing the amount of detail
    // that was requested. Not set if no definitions were requested.
    bonanza.model.starlark.Target.Definition definition = 2;

    // If full definitions were requested and the target is a rule
    // target, the names of the public attributes of the rule, in the
    // order in which their values are stored in
    // definition.rule_target.public_attr_values. This allows clients
    // to display the attributes of the target, without needing to
    // obtain the definition of the rule.
    repeated string public_attr_names = 3;
  }

  message Parent {
    // Reference to an object of type QueryTargetList that contains
    // additional targets.
    bonanza.model.core.DecodableReference reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.QueryTarget";
        }];
  }

  oneof level {
    // A target yielded by the query expression.
    Leaf leaf = 1;

    // More targets are stored in another object.
    Parent parent = 2;
  }
}

// QueryTargets obtains the definitions of the targets contained in an
// object of a B-tree of labels, as returned by QueryExpansion. Labels
// contained in child objects are processed by requesting QueryTargets
// for them as well, meaning that the resulting B-tree follows the
// structure of the B-tree of labels.
//
// As objects are content addressed, this allows results to be reused
// if parts of the B-tree of labels remain unchanged. It also bounds the
// amount of memory needed to process each object.
message QueryTargets {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining definitions of query targets"
    };
    // Reference to an object containing labels of targets.
    bonanza.model.core.DecodableReference target_labels_reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.TargetLabel";
        }];

    // The amount of detail with which definitions of targets should
    // be returned.
    QueryTarget.DefinitionDetail definition_detail = 2;
  }

  message Value {
    // Targets whose labels are contained in the object, in the same
    // order.
    repeated QueryTarget targets = 1;
  }
}

message RawActionResult {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Executing action"
    };
    ExecuteRequest execute_request = 1;
  }

  message Progress {
    option (bonanza.model.evaluation.progress_description) = {
      template: "{stage}"
    };

    enum Stage {
      // The action is queued in the scheduler, waiting for a worker
      // to become available.
      QUEUED = 0;

      // The action is executing on a worker.
      EXECUTING = 1;
    }

    // The stage of execution the action is currently in.
    Stage stage = 1;
  }

  message Value {
    bonanza.model.core.DecodableReference result_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_type_name:
            "bonanza.model.command.Result";
        }];
  }
}

message Constraint {
  // The label of the constraint_setting() target.
  string setting = 1;

  // The label of the constraint_value() target.
  string value = 2;
}

message ExecutionPlatform {
  // Canonical label of the platform target. When this platform is
  // selected, the --platforms flag will be assigned to this target.
  string label = 1;

  // Constraints that apply to the execution platform, such as the
  // CPU architecture or operating system. Constraints are sorted
  // alphabetically by setting.
  //
  // Constraints for which the value is equal to the default value of
  // the setting are omitted.
  repeated Constraint constraints = 2;

  // The elliptic-curve public key that identifies the platform that
  // should be used to execute the action in PKIX, ASN.1 DER form.
  bytes exec_pkix_public_key = 3;

  // TODO: Also add flags, required_settings, etc.?
}

message RegisteredExecutionPlatforms {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining registered execution platforms"
    };
  }

  message Value {
    // List of platforms that are available for executing commands,
    // ordered by decreasing preference.
    repeated ExecutionPlatform execution_platforms = 1;
  }
}

message RegisteredFetchPlatform {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining registered fetch platform"
    };
  }

  message Value {
    // The elliptic-curve public key that identifies the platform that
    // should be used to fetch files from module registries, module
    // sources, and through repository_ctx.download() in PKIX, ASN.1 DER
    // form.
    bytes fetch_platform_pkix_public_key = 1;
  }
}

message RegisteredRepoPlatform {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining registered repo platform"
    };
  }

  message Value {
    message EnvironmentVariable {
      // The name of the environment variable.
      string name = 1;

      // The value of the environment variable.
      string value = 2;
    }

    // The elliptic-curve public key that identifies the platform that
    // should be used to execute the action in PKIX, ASN.1 DER form.
    bytes exec_pkix_public_key = 1;

    // The name of the architecture to announce via repository_os.arch.
    string repository_os_arch = 2;

    // Environment variables to announce via repository_os.environ.
    repeated EnvironmentVariable repository_os_environ = 3;

    // The name of the operating system to announce via
    // repository_os.name.
    string repository_os_name = 4;
  }
}

message RegisteredToolchain {
  message CompatibleWith {
    // List of constraints that must be satisfied by an execution platform
    // in order for this toolchain to be selected for a target building on
    // that platform.
    //
    // Constraints for which the value is equal to the default value of
    // the setting have their value set to the empty string.
    repeated Constraint exec = 1;

    // List of constraints that must be satisfied by the target platform
    // in order for this toolchain to be selected for a target building
    // for that platform.
    //
    // Constraints for which the value is equal to the default value of
    // the setting have their value set to the empty string.
    repeated Constraint target = 2;
  }

  // If set, the toolchain provide separate execution and target
  // platform constraints.
  //
  // If not set, this toolchain behaves as if "exec" and "target"
  // constraints are set to those of the current target platform.
  CompatibleWith compatible_with = 1;

  // List of config_settings that must be satisfied by the target
  // configuration in order for this toolchain to be selected during
  // toolchain resolution.
  repeated string target_settings = 2;

  // Label of target representing the actual tool or tool suite that is
  // made available when this toolchain is selected.
  //
  // As toolchain targets are typically placed in other repos, this
  // label may still refer to an alias that needs to be expanded.
  string toolchain = 3;
}

message RegisteredToolchains {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining registered toolchains"
    };
  }

  message Value {
    message RegisteredToolchainType {
      // The label of the toolchain type for which one or more
      // toolchains are registered.
      string toolchain_type = 1;

      // Properties of the toolchains that were registered, listed in
      // the order in which registration occurred.
      repeated RegisteredToolchain toolchains = 2;
    }

    // Toolchain types for which one or more toolchains are registered,
    // sorted by toolchain type label.
    repeated RegisteredToolchainType toolchain_types = 1;
  }
}

message RegisteredToolchainsForType {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining registered toolchains of type {toolchain_type}"
    };
    // The label of the toolchain type for which toolchains are
    // requested.
    string toolchain_type = 1;
  }

  message Value {
    // Properties of the toolchains that were registered for the
    // requested type, listed in the order in which registration
    // occurred. An empty list is returned if no toolchains for this
    // type were registered.
    repeated RegisteredToolchain toolchains = 2;
  }
}

message Repo {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Fetching @@{canonical_repo}"
    };
    // The canonical name of the repo whose file contents are being
    // requested.
    string canonical_repo = 1;
  }

  message Value {
    // The root directory containing the files in the repository.
    //
    // For this directory, maximum_symlink_escapement_levels may only
    // have one of the following values:
    //
    // - 0: The repo does not contain any symbolic links, or all
    //   symbolic links expand to paths within the same repo.
    //
    // - 1: The repo contains symbolic links that expand to paths in
    //   other repos (e.g., "../other_repo/hello.txt").
    bonanza.model.filesystem.DirectoryReference root_directory_reference = 1;
  }
}

message RepoDefaultAttrs {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining default attrs of @@{canonical_repo}"
    };
    // The canonical name of the repo for which the defaults specified
    // in REPO.bazel are requested.
    string canonical_repo = 1;
  }

  message Value {
    // Default values of attributes that need to be attached to all
    // targets in this repo.
    bonanza.model.starlark.InheritableAttrs inheritable_attrs = 1;
  }
}

message RepoPlatformHostPath {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Resolving host path {absolute_path}"
    };
    // Absolute path of a file or directory on workers of the repo
    // platform whose contents should be captured. If the path refers to
    // a symlink, it should be followed.
    string absolute_path = 1;
  }

  message Value {
    message Directory {
      // The top level of the B-tree of the directory hierarchy.
      repeated bonanza.model.filesystem.DirectoryEntry entries = 1;
    }

    oneof captured_path {
      // The provided path corresponds to (a symlink pointing to) a
      // file. The contents of the file are provided.
      bonanza.model.filesystem.FileProperties file = 1;

      // The provided path corresponds to (a symlink pointing to) a
      // directory. The resulting directory may not contain any symlinks
      // that escape the directory hierarchy. If such symlinks are
      // encountered when creating this directory, they are expanded.
      Directory directory = 2;
    }
  }
}

message RepoPlatformLabel {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining repo platform label"
    };
  }

  message Value {
    // Apparent label of the platform() that should be used for
    // executing commands as part of module extensions and repository
    // rules, as provided by the client through the --repo_platform
    // command line flag. The label is relative to the root package of
    // the root module.
    //
    // If this field is not set, the build will be unable to evaluate
    // module extensions and repository rules.
    string apparent_label = 1;
  }
}

message ResolvedToolchains {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Resolving toolchains"
    };
    // List of constraints that must be satisfied by an execution
    // platform in order for this toolchain to be selected for a target
    // building on that platform.
    //
    // Constraints for which the value is equal to the default value of
    // the setting have their value set to the empty string.
    repeated Constraint exec_compatible_with = 1;

    // Platform constraints and build settings that are currently active.
    //
    // If this reference is not set, toolchains needd to be resolved
    // without any platform constraints and build settings in place.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];

    // The set of toolchains to resolve, and any constraints placed on
    // the execution platform.
    repeated bonanza.model.starlark.ToolchainType toolchains = 3;
  }

  message Value {
    // Identifiers of the resolved toolchains, using the same order as
    // the toolchain types in the key. Any optional toolchains that
    // could not be resolved will have their identifier set to the
    // empty string.
    repeated string toolchain_identifiers = 1;

    // Label of an execution platform that is capable of running actions
    // using executables that are part of the resolved toolchains.
    string platform_label = 2;

    // The elliptic-curve public key that identifies the execution
    // platform that is capable of running executables that are part of
    // the resolved toolchains, in PKIX, ASN.1 DER form.
    bytes platform_pkix_public_key = 3;
  }
}

message RootModule {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining root module"
    };
  }

  message Value {
    // The name of the root module.
    string root_module_name = 1;

    // Whether to ignore `bazel_dep` and `use_extension` declared as
    // `dev_dependency` in the MODULE.bazel of the root module. Note
    // that such dependencies are always ignored in the MODULE.bazel
    // file of modules other than the root module.
    bool ignore_root_module_dev_dependencies = 2;
  }
}

message RuleImplementationWrappers {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining rule implementation wrappers"
    };
  }

  message Value {
    // Function that needs to be invoked instead of the implementation
    // function of rules. If not set, the implementation function is
    // invoked directly.
    bonanza.model.starlark.Function rule = 1;

    // Function that needs to be invoked instead of the implementation
    // function of subrules. If not set, the implementation function
    // is invoked directly.
    bonanza.model.starlark.Function subrule = 2;

    // Function that needs to be invoked instead of the implementation
    // function of aspects. If not set, the implementation function is
    // invoked directly.
    bonanza.model.starlark.Function aspect = 3;
  }
}

message RuleImplementationWrappersIdentifiers {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining identifiers of rule implementation wrappers"
    };
  }

  message Value {
    // Identifier of the Starlark function that needs to be invoked
    // instead of the implementation function of rules. If not set, the
    // implementation function is invoked directly.
    string rule_identifier = 1;

    // Identifier of the Starlark function that needs to be invoked
    // instead of the implementation function of subrules. If not set,
    // the implementation function is invoked directly.
    string subrule_identifier = 2;

    // Identifier of the Starlark function that needs to be invoked
    // instead of the implementation function of aspects. If not set,
    // the implementation function is invoked directly.
    string aspect_identifier = 3;
  }
}

message Select {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Evaluating select() on {condition_identifiers}"
    };
    // Condition identifiers from which a selection needs to be made.
    repeated string condition_identifiers = 1;

    // Platform constraints and build settings that are currently active.
    //
    // If this reference is not set, conditions are selected without any
    // platform constraints and build settings in place.
    bonanza.model.core.DecodableReference configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];

    // The package that invokes select().
    string from_package = 3;
  }

  message Value {
    // Indices of conditions which are selected.
    //
    // If an empty list is returned, the default condition should be
    // selected. If multiple indices are returned, multiple conditions
    // match that are not specializations of each other. In that case
    // the caller should check whether the values associated with the
    // conditions are identical.
    repeated uint32 condition_indices = 1;
  }
}

message StableInputRootPath {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining stable input root path"
    };
  }

  message Value {
    // The path at which workers belonging to the registered repo
    // platform expose input roots.
    //
    // Repository rules and module extensions often make assumptions
    // about the absolute locations at which repositories are created.
    // Functions like module_ctx.path() and repository_ctx.path() should
    // return absolute paths that are representative of w
    string input_root_path = 1;
  }
}

message StarlarkValueEncoders {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining Starlark value encoders"
    };
  }

  message Value {
    // Parameters that need to be used to access the contents of large
    // strings, which are stored in the same way as file contents.
    bonanza.model.filesystem.FileAccessParameters file_access_parameters = 1;

    // Encoders that should be used when creating objects that are
    // part of Starlark values and compiled programs.
    repeated bonanza.model.encoding.BinaryEncoder starlark_value_encoders = 2;
  }
}

message SuccessfulActionResult {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Executing action"
    };
    ExecuteRequest execute_request = 1;
  }

  message Value {
    bonanza.model.core.DecodableReference outputs_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.command.Outputs";
        }];
  }
}

message Target {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Loading target {label}"
    };
    // The label of the target whose properties to obtain.
    string label = 1;
  }

  message Value {
    // The definition of the target. If the target does not exist,
    // this field is not set.
    bonanza.model.starlark.Target.Definition definition = 1;
  }
}

message TargetActionId {
  // The label of the target that declared the action.
  string label = 1;

  // The configuration that was used to compute the configured target
  // declaring the action, and the aspects that are applied to it. If
  // aspects are provided, the action is declared by the last aspect.
  bonanza.model.starlark.TargetVariant variant = 2;

  // The identifier of the action within the configured target.
  bytes action_id = 3;
}

message TargetAction {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining definition of an action of {id.label}"
    };
    // The identifier of the target action.
    TargetActionId id = 1;
  }

  message Value {
    // The definition of the action.
    TargetActionDefinition definition = 1;
  }
}

message TargetActionCommand {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Constructing command of an action of {id.label}"
    };
    // The identifier of the target action.
    TargetActionId id = 1;
  }

  message Value {
    bonanza.model.core.DecodableReference command_reference = 1
        [(bonanza.model.core.object_format) = {
          proto_type_name:
            "bonanza.model.command.Command";
        }];
  }
}

message TargetActionInputRoot {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Constructing input root of an action of {id.label}"
    };
    // The identifier of the target action.
    TargetActionId id = 1;
  }

  message Value {
    bonanza.model.filesystem.DirectoryReference input_root_reference = 1;
  }
}

message TargetActionResult {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Running an action of {id.label}"
    };
    // The identifier of the target action.
    TargetActionId id = 1;
  }

  message Value {
    // The contents of output files and directories of this action.
    repeated bonanza.model.filesystem.DirectoryEntry output_root = 1;
  }
}

message TargetCompletion {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Building {label}"
    };
    // The label of the package. The label MUST include a canonical repo
    // name, and MUST NOT include a target name if it matches the last
    // component of the package path.
    string label = 1;

    // The configuration in which the target is built, and the aspects
    // that are applied to it. If aspects are provided, the outputs of
    // the last aspect are built, as opposed to the outputs of the
    // target itself. This is used to build aspects that are applied to
    // top-level targets.
    bonanza.model.starlark.TargetVariant variant = 2;

    // The outputs of the target or aspect to build.
    OutputSelection outputs = 3;
  }

  message Value {
    // The names of the output groups listed in
    // Key.outputs.output_groups that are provided by the target or
    // aspect, sorted alphabetically.
    repeated string provided_output_groups = 1;
  }
}

// TargetDirectDependencies returns the labels of the targets on which
// a target depends directly, without applying any configuration. For
// rule targets with attributes using select(), the dependencies of all
// branches are returned, including the labels of the conditions.
message TargetDirectDependencies {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining direct dependencies of {label}"
    };
    // The canonical label of the target whose dependencies to obtain.
    string label = 1;

    // Whether to include dependencies on targets that are not
    // explicitly declared in BUILD files, such as ones that are
    // introduced by private attributes and attribute default values.
    bool include_implicit_deps = 2;
  }

  message Value {
    // Canonical labels of the targets on which the target depends.
    repeated TargetLabel target_labels = 1;
  }
}

// TargetLabel is an element of a B-tree containing canonical labels of
// targets. Labels are stored in the order defined by
// label.CanonicalLabel.Compare(), and are deduplicated.
message TargetLabel {
  message Parent {
    // Reference to an object of type TargetLabelList that contains
    // additional labels.
    bonanza.model.core.DecodableReference reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.TargetLabel";
        }];

    // The first and last label contained in this B-tree. These
    // fields can be used to efficiently merge B-trees of labels,
    // without loading objects whose labels don't overlap with those
    // of other B-trees.
    string first_label = 2;
    string last_label = 3;
  }

  oneof level {
    // The canonical label of a target.
    string leaf = 1;

    // More labels are stored in another object.
    Parent parent = 2;
  }
}

message TargetProvider {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining provider {provider_identifier} of {label}"
    };
    // The label of the package. The label MUST include a canonical repo
    // name, and MUST NOT include a target name if it matches the last
    // component of the package path.
    string label = 1;

    // The configuration in which the target is requested, and the
    // aspects that need to be applied to it, using the same semantics
    // as TargetProviders.Key.variant.
    bonanza.model.starlark.TargetVariant variant = 2;

    // The identifier of the provider whose value is requested.
    string provider_identifier = 3;
  }

  message Value {
    // The fields of the provider instance that this target produced.
    // This may be left unset if the target did not yield an instance of
    // this provider.
    bonanza.model.starlark.Struct.Fields fields = 1;
  }
}

message TargetProviders {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining providers of {label}"
    };
    // The label of the package. The label MUST include a canonical repo
    // name, and MUST NOT include a target name if it matches the last
    // component of the package path.
    string label = 1;

    // The configuration in which the target is requested, and the
    // aspects that need to be applied to it. The target is analyzed in
    // the configuration yielded by the target's incoming edge
    // transition. Aspects are applied in that configuration as well.
    //
    // The provider instances of the target are merged with those of
    // all aspects. Instances of OutputGroupInfo are merged by combining
    // their fields, it being an error for multiple instances to provide
    // the same output group. As aspects may not return DefaultInfo,
    // the target's instance is used. It is an error for the target and
    // aspects to provide instances of any other provider. Aspects that
    // don't apply to the target don't contribute any providers.
    bonanza.model.starlark.TargetVariant variant = 2;
  }

  message Value {
    // The values of the provider instances that this target produced,
    // sorted alphabetically by provider identifier.
    repeated bonanza.model.starlark.Struct provider_instances = 1;

    // Whether the target is a file target, being either a source file
    // or a predeclared output file.
    bool is_file_target = 2;
  }
}

// TestSuiteTests returns the labels of the tests that are part of a
// test suite, after recursively expanding any test suites contained
// within, and applying the test suite's filters on tags and sizes.
message TestSuiteTests {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Expanding tests of test suite {label}"
    };
    // The canonical label of the test suite.
    string label = 1;
  }

  message Value {
    // Canonical labels of the tests that are part of the test suite.
    repeated TargetLabel target_labels = 1;
  }
}

message ModuleExtension {
  message User {
    // The module instance that uses the module extension.
    string module_instance = 1;

    // Whether the module instance is the root module.
    bool is_root = 2;

    // Tag classes for which one or more tags are provided by this
    // module instance.
    repeated TagClass tag_classes = 3;
  }

  message TagClass {
    // Starlark identifier of the tag class.
    string name = 1;

    // One or more tags of this class that have been provided.
    repeated Tag tags = 2;
  }

  message Tag {
    // Attributes that are provided to this tag.
    //
    // No attempts have been performed to canonicalize the values of
    // these attributes. For example, this means that labels may be
    // stored as plain strings that later on need to be resolved to the
    // proper canonical target.
    bonanza.model.starlark.Struct.Fields attrs = 1;

    // Whether the tag was specified on the result of a use_extension()
    // call with dev_dependency = True.
    bool is_dev_dependency = 2;
  }

  // Canonical Starlark identifier of the module_extension() object.
  string identifier = 1;

  // Modules instances that use the module extension. The order of this
  // list is the same as a breadth-first search starting from the root
  // module.
  repeated User users = 2;

  // Whether the MODULE.bazel file of the root module contains one or
  // more calls to use_extension() for this extension with
  // dev_dependency set to False.
  bool root_module_has_non_dev_dependency = 3;
}

message UsedModuleExtension {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Obtaining usage of module extension {module_extension}"
    };
    string module_extension = 1;
  }

  message Value {
    ModuleExtension module_extension = 1;
  }
}

message UsedModuleExtensions {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Listing used module extensions"
    };
  }

  message Value {
    // List of module extensions that has one or more users. Module
    // extensions are sorted by module extension name, which can be
    // derived from the canonical Starlark identifier of the
    // module_extension() object.
    repeated ModuleExtension module_extensions = 1;
  }
}

message UserDefinedTransition {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Applying transition {transition_identifier}"
    };
    // The Starlark identifier of the transition to apply.
    string transition_identifier = 1;

    // The configuration from which inputs need to be sourced.
    bonanza.model.core.DecodableReference input_configuration_reference = 2
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];
  }

  message Value {
    message Success {
      message Entry {
        // Key by which the output configuration is identified.
        string key = 1;

        // Output configuration that is identified by this key.
        bonanza.model.core.DecodableReference output_configuration_reference = 2
            [(bonanza.model.core.object_format) = {
              proto_list_type_name:
                "bonanza.model.analysis.BuildSettingOverride";
            }];
      }

      // Dictionary of output configurations yielded by the transition.
      // Entries are sorted alphabetically by key.
      repeated Entry entries = 1;
    }

    oneof result {
      // The transition could not be computed, because the transition is
      // an outgoing edge transition that depends on attrs of the target
      // to which the transition is attached. The caller is responsible
      // for computing the transition manually.
      google.protobuf.Empty transition_depends_on_attrs = 1;

      // The transition yielded a dictionary of configurations, where
      // each configuration is identified by a string.
      Success success = 2;
    }
  }
}

message VisibleTarget {
  message Key {
    option (bonanza.model.evaluation.key_description) = {
      template: "Resolving {to_label} as seen from {from_package}"
    };
    // The package that references the label.
    string from_package = 1;

    // The label being referenced.
    string to_label = 2;

    // Don't fail if the target is an alias() that contains a select()
    // expression that does not many any of the conditions. In that case the
    // resulting label will be set to the empty string.
    //
    // This may be used to suppress errors in case the provided label
    // was obtained by expanding a target pattern, and any incompatible
    // targets should be ignored, (e.g., as part of
    // register_toolchains()).
    bool permit_alias_no_match = 3;

    // Platform constraints and build settings that are currently active.
    //
    // If this reference is not set, the alias is resolved without any
    // platform constraints and build settings into account.
    bonanza.model.core.DecodableReference configuration_reference = 4
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.analysis.BuildSettingOverride";
        }];

    // Instead expanding targets of type label_setting() taking the
    // configuration into account, return the label identifier of the
    // label_setting() itself.
    bool stop_at_label_setting = 5;
  }

  message Value {
    // The label of the target after aliases are expanded and visibility
    // is checked.
    //
    // Even if permit_alias_no_match is not set, this value may be left
    // empty if the target is a label setting for which no explicit
    // default value is set.
    string label = 1;
  }
}
