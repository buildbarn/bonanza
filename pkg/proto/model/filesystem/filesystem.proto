syntax = "proto3";

package bonanza.model.filesystem;

import "bonanza.build/pkg/proto/model/chunking/chunking.proto";
import "bonanza.build/pkg/proto/model/core/core.proto";
import "bonanza.build/pkg/proto/model/encoding/encoding.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

option go_package = "bonanza.build/pkg/proto/model/filesystem";

message FileProperties {
  // The contents of the file. If the file is empty (i.e., zero bytes in
  // size), this field is left unset.
  FileContents contents = 1;

  // If true, the file is executable. This corresponds to the +x
  // permission bit present on UNIX file systems.
  bool is_executable = 2;
}

message SymlinkProperties {
  // The target of the symbolic link. The path separator used is a
  // forward slash. The target path can be relative to the parent
  // directory of the symbolic link, or it can be an absolute path
  // starting with a forward slash.
  string target = 1;
}

message DirectoryProperties {
  // The number of subdirectories present in the subdirectory. This
  // value needs to be provided to make the link count of directories
  // accurate when exposed through a virtual file system, without
  // requiring that the contents of the subdirectory are loaded.
  uint32 directories_count = 1;
}

// An entry in the B-tree that stores the contents of a directory.
//
// The B-tree consists of two sections:
//
// 1. One directory_contents element for each subdirectory, stored in
//    the same order as the subdirectory nodes in the second section.
//
// 2. One node for each file, symbolic link and subdirectory contained
//    in the directory, stored in alphabetical order. These nodes
//    contain all properties of files and symbolic links, but only a
//    small amount of metadata of subdirectories. This makes it possible
//    to list the contents of a directory by only scanning this section.
//
// Each entry can be thought of as having a key: directory_contents
// elements have the empty string as their key, while nodes have their
// name as their key. As names cannot be empty, this means that all
// entries in the B-tree are sorted by key.
//
// To obtain the contents of a subdirectory, its name is first looked up
// in the second section. Its index among the subdirectory nodes yields
// the index of the subdirectory's contents in the first section.
message DirectoryEntry {
  message DirectoryContents {
    // The top level of the subdirectory's B-tree.
    repeated DirectoryEntry entries = 1;
  }

  message Parent {
    // Reference to an object containing additional entries.
    bonanza.model.core.DecodableReference reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.filesystem.DirectoryEntry";
        }];

    // The key of the first entry contained in this part of the B-tree.
    // This is the name of the first node, or the empty string if this
    // part of the B-tree starts with a directory_contents element.
    //
    // This value can be used to look up nodes by name without loading
    // the objects referenced by this B-tree. When looking up nodes,
    // parts of the B-tree that don't contain any nodes can be skipped.
    string first_name = 2;

    // The number of nodes for files and symbolic links contained in
    // this part of the B-tree. Nodes for subdirectories are not
    // included, as they are counted by directory_nodes_count. The
    // total number of nodes (i.e., elements in the second section) is
    // equal to the sum of these two fields.
    uint32 leaf_nodes_count = 3;

    // The number of nodes for subdirectories contained in this part of
    // the B-tree. This value can be used to compute the index of a
    // subdirectory among all subdirectories, which is needed to locate
    // its contents in the first section. It can also be used to
    // compute the link count of the directory.
    uint32 directory_nodes_count = 4;

    // The number of directory_contents elements (i.e., elements in the
    // first section) contained in this part of the B-tree.
    uint32 directory_contents_count = 5;

    // Value indicating up to how many levels the symbolic links
    // contained in this part of the B-tree, including the ones
    // contained in the directory hierarchies of the subdirectories,
    // escape the directory to which this B-tree belongs. The semantics
    // of this field are identical to
    // DirectoryReference.maximum_symlink_escapement_levels.
    //
    // This value can be used to determine whether symbolic links
    // escape, without loading the objects referenced by this B-tree.
    google.protobuf.UInt32Value maximum_symlink_escapement_levels = 6;
  }

  message Node {
    // The name of the file, symbolic link or subdirectory.
    string name = 1;

    oneof kind {
      // The node is a regular file.
      FileProperties file = 2;

      // The node is a symbolic link.
      SymlinkProperties symlink = 3;

      // The node is a subdirectory. Its contents are stored in the
      // corresponding directory_contents element in the first section.
      DirectoryProperties directory = 4;
    }
  }

  oneof level {
    // More entries are stored in another object.
    Parent parent = 1;

    // A file, symbolic link or subdirectory contained in the directory.
    // Only permitted in the second section.
    Node node = 2;

    // The contents of a subdirectory. Only permitted in the first
    // section.
    //
    // The top level of the subdirectory's B-tree is identical to how it
    // would be stored if the subdirectory were a root directory. Any
    // maximum_symlink_escapement_levels of parent nodes contained
    // within are relative to the subdirectory, not to the directory
    // containing this entry.
    DirectoryContents directory_contents = 3;
  }
}

message DirectoryReference {
  // Reference to an object containing the top level of a directory's
  // B-tree.
  //
  // As objects cannot be empty, this field is left unset if the
  // directory is empty.
  bonanza.model.core.DecodableReference reference = 1
      [(bonanza.model.core.object_format) = {
        proto_list_type_name:
          "bonanza.model.filesystem.DirectoryEntry";
      }];

  // The number of subdirectories present in the directory. This value
  // needs to be provided to make the link count of directories accurate
  // when exposed through a virtual file system.
  uint32 directories_count = 2;

  // Value indicating up to how many levels the symbolic links contained
  // in this directory hierarchy escape the current directory.
  //
  // - When the field is left unset, it indicates that the directory
  //   hierarchy contains one or more symbolic links whose targets are
  //   absolute paths, or contain ".." components that are not within
  //   the leading part of the target (e.g., "a/b/../c").
  //
  // - When set to zero, it indicates that the directory hierarchy does
  //   not contain any symbolic links, or that any targets of symbolic
  //   links contained within do not contain a sufficient number of ".."
  //   components to escape the current directory.
  //
  // - When set to a value greater than zero, it indicates that the
  //   directory hierarchy contains symbolic links whose targets have
  //   a sufficient number of leading ".." components to escape the
  //   current directory. The value corresponds to the maximum number of
  //   leading ".." components minus the depth at which the symbolic
  //   link is stored.
  google.protobuf.UInt32Value maximum_symlink_escapement_levels = 3;
}

message FileContents {
  message List {
    // Reference to a list of FileContents messages. As the FileContents
    // list MUST reference at least one chunk (directly or indirectly),
    // the height of the reference MUST have a height greater than zero.
    bonanza.model.core.DecodableReference reference = 1
        [(bonanza.model.core.object_format) = {
          proto_list_type_name:
            "bonanza.model.filesystem.FileContents";
        }];

    // If set, the FileContents list contains at least one hole, either
    // directly or indirectly. This information can be used to
    // efficiently implement lseek()'s SEEK_HOLE.
    bool sparse = 2;
  }

  oneof level {
    // The file containing at least one non-null byte that is large
    // enough, that it could not be expressed as a single chunk. The
    // contents of the file may be obtained by concatenating chunks and
    // holes.
    List list = 1;

    // A small file containing at least one non-null byte. The reference
    // points to an object of height zero, containing the literal
    // contents of the file.
    bonanza.model.core.DecodableReference chunk_reference = 2
        [(bonanza.model.core.object_format) = { raw: {} }];

    // A file consisting entirely of null bytes. When stored in lists,
    // holes cannot be succeeded/preceded by other holes. In other
    // words, adjoining holes MUST be merged.
    google.protobuf.Empty hole = 3;
  }

  // The total size of all chunks of data and holes in this file. The
  // size has to be greater than zero.
  uint64 total_size_bytes = 4;

  // Summary of the data covered by this node, as computed by package
  // bonanza.build/pkg/encoding/utf8stat. It indicates whether the data
  // is valid UTF-8 without any NUL bytes, the number of line breaks it
  // contains, whether it ends with a newline, and any partial runes at
  // its start or end. This allows obtaining the line count of a file,
  // or translating offsets to line numbers, without reading chunks.
  //
  // - For chunk_reference, it is equal to utf8stat.Compute() of the
  //   chunk's data.
  // - For list, it is equal to utf8stat.Combine() of all parts in the
  //   list, in order.
  // - For hole, it is always zero (i.e., invalid), as holes consist of
  //   NUL bytes.
  uint64 utf8_stat = 5;
}

// Data that is stored inline if it is small enough, and as file
// contents in separate objects otherwise. Empty data is represented by
// leaving the oneof unset, like FileContents fields elsewhere.
//
// To ensure that data has a canonical encoding, data MUST be stored
// inline if and only if its size does not exceed a limit that is
// specified by the context in which this message is used.
message MaybeInlineFileContents {
  oneof level {
    // The data is small enough to be stored inline.
    bytes contents_inline = 1;

    // The data is too large to be stored inline.
    FileContents contents_external = 2;
  }
}

message DirectoryAccessParameters {
  // Encoders that were used when creating objects containing
  // DirectoryEntry messages.
  repeated bonanza.model.encoding.BinaryEncoder encoders = 1;
}

message DirectoryCreationParameters {
  // Parameters that need to be used when either accessing or creating
  // objects containing DirectoryEntry messages.
  DirectoryAccessParameters access = 1;

  // Parameters of the chunking algorithm that is used to partition the
  // B-trees of directories into objects.
  //
  // The top level of a directory's B-tree is either smaller than the
  // minimum size, or consists of a single entry. Additional
  // levels are added to the B-tree as needed. This ensures that
  // individual directory_contents elements remain small enough to be
  // chunked. This rule also applies to root directories, so that the
  // top level of a directory's B-tree does not depend on whether it is
  // a root directory or a subdirectory.
  bonanza.model.chunking.Parameters directories_parameters = 2;
}

message FileAccessParameters {
  // Encoders that were used when creating objects containing chunks of
  // data.
  repeated bonanza.model.encoding.BinaryEncoder chunk_encoders = 1;

  // Encoders that were used when creating objects containing lists of
  // FileContents messages.
  repeated bonanza.model.encoding.BinaryEncoder file_contents_list_encoders = 2;
}

message FileCreationParameters {
  // Parameters that need to be used when either accessing or creating
  // objects containing file contents.
  FileAccessParameters access = 1;

  // Parameters of the content defined chunking algorithm that is used
  // to partition the contents of files into chunks. The resulting
  // chunks may be smaller than the minimum size, if and only if the
  // file consists of a single chunk.
  bonanza.model.chunking.Parameters chunk_parameters = 2;

  // Seed to derive values for the Gear table of the content defined
  // chunking algorithm that is used to chunk files.
  bytes chunk_gear_table_seed = 3;

  // Parameters of the chunking algorithm that is used to partition
  // lists of FileContents messages into objects. The resulting objects
  // may be smaller than the minimum size, if and only if the file
  // consists of fewer chunks than are needed to reach the limit. They
  // may slightly exceed the maximum size, as individual FileContents
  // messages cannot be split.
  bonanza.model.chunking.Parameters file_contents_list_parameters = 4;
}
