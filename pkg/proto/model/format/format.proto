syntax = "proto3";

package bonanza.model.format;

import "google/protobuf/empty.proto";

option go_package = "bonanza.build/pkg/proto/model/format";

// Format of a payload, such as the contents of an object or the value
// of a bonanza.model.core.Opaque.
message Format {
  oneof format {
    // The payload consists of binary data (e.g., a file chunk).
    google.protobuf.Empty raw = 1;

    // The payload consists of a Protobuf message. The full name of the
    // message type is provided.
    string proto_type_name = 2;

    // The payload consists of a varint separated list of Protobuf
    // messages. The full name of the message type is provided.
    string proto_list_type_name = 3;
  }
}
