syntax = "proto3";

package bonanza.model.starlark;

import "bonanza.build/pkg/proto/model/core/core.proto";
import "bonanza.build/pkg/proto/model/filesystem/filesystem.proto";
import "google/protobuf/empty.proto";

option go_package = "bonanza.build/pkg/proto/model/starlark";

message CompiledProgram {
  // Globals of the file that may be accessed by other files, or by
  // functions declared in the file. This includes all public globals,
  // and private globals that are referenced by functions.
  Struct.Fields globals = 1;

  message FunctionEntry {
    message Leaf {
      // The name of the function.
      Function.Name name = 1;

      // The code of the function, including that of all functions
      // nested inside it.
      Funcode code = 2;
    }

    message Parent {
      // Reference to an object containing additional entries.
      bonanza.model.core.DecodableReference reference = 1
          [(bonanza.model.core.object_format) = {
            proto_list_type_name:
              "bonanza.model.starlark.CompiledProgram.FunctionEntry";
          }];

      // The name of the first function contained in the object.
      Function.Name first_name = 2;

      // The total number of functions contained in the object and its
      // children. This makes it possible to determine the position of
      // a function within the B-tree while searching for it.
      uint32 function_count = 3;
    }

    oneof level {
      Leaf leaf = 1;
      Parent parent = 2;
    }
  }

  // B-tree containing the code of all functions and lambdas that are
  // declared at the top level of the file, sorted by name and
  // disambiguation index.
  repeated FunctionEntry functions = 2;

  // The line of the "def" or "lambda" keyword of each of the functions
  // in the B-tree above, in the same order. These are stored separately
  // to ensure that the B-tree doesn't change if lines are added to or
  // removed from other parts of the file.
  repeated uint32 top_level_function_lines = 3;
}

message Value {
  oneof kind {
    Aspect aspect = 1;
    Attr attr = 2;
    bool bool = 3;
    string builtin = 4;
    bonanza.model.filesystem.MaybeInlineFileContents bytes = 5;
    Depset depset = 6;
    Dict dict = 7;
    ExecGroup exec_group = 8;
    File file = 9;
    Function function = 10;
    // Integer, encoded as a big-endian two's complement value.
    bytes int = 11;
    string label = 12;
    List list = 13;
    Macro macro = 30;
    ModuleExtension module_extension = 14;
    google.protobuf.Empty none = 15;
    Provider provider = 16;
    RepositoryRule repository_rule = 17;
    Rule rule = 18;
    Select select = 20;
    Set set = 21;
    bonanza.model.filesystem.MaybeInlineFileContents str = 22;
    Struct struct = 23;
    Subrule subrule = 24;
    TagClass tag_class = 25;
    TargetReference target_reference = 26;
    ToolchainType toolchain_type = 27;
    Transition transition = 28;
    Tuple tuple = 29;
  }
}

message Alias {
  // The label of the target to which the alias expands.
  Select.Group actual = 1;

  // The visibility of the alias, which may differ from the visibility
  // of the target to which the alias expands.
  PackageGroup visibility = 2;
}

message Aspect {
  // Edges along which an aspect propagates, corresponding to the
  // attr_aspects and toolchains_aspects parameters of aspect().
  message PropagationEdges {
    message Fixed {
      // Names of the edges, sorted alphabetically.
      repeated string names = 1;
    }

    oneof kind {
      // The aspect propagates along a fixed set of edges.
      Fixed fixed = 1;

      // The aspect propagates along all edges, corresponding to
      // providing ["*"] to aspect().
      google.protobuf.Empty all = 2;

      // The edges along which the aspect propagates are computed by
      // invoking a Starlark function for each target to which the
      // aspect is applied.
      Function function = 3;
    }
  }

  message Definition {
    // Attributes of the aspect, sorted by name.
    //
    // Public attributes are parameters of the aspect. Their values are
    // taken from the attributes with the same name of the rule target
    // that requests the aspect to be applied, or from the command line
    // for aspects applied to top-level targets. Public attributes MUST
    // be of type bool, int or string.
    //
    // Private attributes MUST have a default value. Label attributes
    // MUST NOT use user-defined transitions. This guarantees that their
    // values only depend on the aspect and the configuration in which
    // it is applied, as is the case for subrules.
    //
    // Like for rules, private attributes are injected for providing
    // ctx.configuration, ctx.fragments, ctx.var and
    // ctx.target_platform_has_constraint().
    repeated NamedAttr attrs = 1;

    // The attributes of rules along which the aspect propagates. If
    // the aspect is applied to a target, it is also applied to all
    // targets referenced through these attributes. If not set, the
    // aspect does not propagate along any attributes.
    PropagationEdges attr_aspects = 2;

    // Execution groups of the aspect, sorted by name. The toolchains
    // and execution constraints provided to aspect() are added to the
    // default execution group, which is identified by the empty name.
    repeated NamedExecGroup exec_groups = 3;

    // Starlark function that implements this aspect. It is invoked
    // with the target to which the aspect is applied and ctx as
    // arguments. Unlike the implementation functions of rules, it MUST
    // NOT return an instance of DefaultInfo.
    Function implementation = 4;

    // Sets of providers that the rule of a target needs to advertise
    // through Rule.Definition.provides for the aspect to be applied. The
    // aspect is applied if all providers of at least one of the sets
    // are advertised. Sets are encoded in the same way as
    // Attr.LabelOptions.providers, meaning that a single empty set
    // causes the aspect to be applied to targets of all rules. This is
    // the default if no required providers are specified.
    repeated ProviderSet required_providers = 5;

    // Sets of providers that other aspects applied to the same target
    // need to advertise through Aspect.Definition.provides, for this
    // aspect to see their providers. Sets are encoded in the same way
    // as required_providers. Unlike required_providers, this list is
    // empty by default, meaning that the providers of other aspects
    // are not visible.
    repeated ProviderSet required_aspect_providers = 6;

    // Identifiers of providers that the implementation function must
    // return, sorted alphabetically.
    repeated string provides = 7;

    // Identifiers of aspects that need to be applied to a target before
    // this aspect, in the order in which they are provided to
    // aspect(requires = ...). Duplicates are removed.
    repeated string requires = 8;

    // If set, the aspect is applied to the rule target that generates
    // a predeclared output file when the output file is referenced, as
    // opposed to being skipped.
    bool apply_to_generating_rules = 9;

    // Identifiers of subrules that may be invoked by the implementation
    // function of this aspect, sorted alphabetically.
    repeated string subrule_identifiers = 10;

    // The toolchain types to whose toolchains the aspect propagates,
    // identified by their labels. If the aspect is applied to a
    // target, it is also applied to the toolchains of these types that
    // were resolved for the target, meaning their providers are visible
    // through ctx.rule.toolchains. If not set, the aspect does not
    // propagate to any toolchains.
    PropagationEdges toolchains_aspects = 11;

    // If set, a Starlark function that is invoked prior to applying
    // the aspect to a target. It is invoked with a context object as
    // its argument, providing access to the label and kind of the
    // target's rule through ctx.rule, and the aspect's parameters
    // through ctx.attr. If it returns False, the aspect is not applied
    // to the target, and is thus also not propagated further.
    //
    // This is complementary to attr_aspects and required_providers.
    // attr_aspects controls along which edges the aspect propagates,
    // while required_providers and this function control whether the
    // aspect is applied to the targets reached.
    //
    // Like Bazel, this feature is experimental, and its semantics may
    // change over time.
    Function propagation_predicate = 12;
  }

  oneof kind {
    string reference = 1;

    Definition definition = 2;
  }
}

// An aspect that is applied to a target, together with the values of
// its parameters. Sequences of these messages are used to identify the
// aspects that are applied to a target, in the order in which they are
// applied. Each aspect is able to see the providers of the aspects
// preceding it, if they are listed in required_aspect_providers.
message AppliedAspect {
  // The Starlark identifier of the aspect.
  string identifier = 1;

  // Reference to an object containing the values of the public
  // attributes of the aspect, keyed by attribute name. Values are
  // either a bool, int or str. Attributes whose values are equal to
  // their default value are omitted. If no attributes are set to
  // values that differ from their default values, this field is not
  // set.
  //
  // As this message is used as part of keys of analysis functions,
  // parameters are stored in a separate object. This keeps keys small,
  // even if lists of aspects are repeated across many keys. It also
  // means that equal sets of parameters yield the same reference, as
  // long as they are encoded deterministically.
  //
  // The object is created by analysis functions, and is thus encoded
  // using the analysis encoders. Like for any other Starlark value,
  // objects containing the values of the fields are encoded using the
  // Starlark value encoders.
  bonanza.model.core.DecodableReference parameters = 2
      [(bonanza.model.core.object_format) = {
        proto_type_name:
          "bonanza.model.starlark.Struct.Fields";
      }];
}

// The variant of a target that is analyzed: the configuration in which
// it is analyzed, and the aspects that are applied to it. This message
// is used as part of keys of analysis functions. To ensure that keys
// are encoded identically, fields of this type MUST NOT be set if the
// configuration is empty and no aspects are applied.
message TargetVariant {
  // Platform constraints and build settings that are active.
  //
  // If this reference is not set, the target is configured without
  // any platform constraints and build settings in place.
  bonanza.model.core.DecodableReference configuration_reference = 1
      [(bonanza.model.core.object_format) = {
        proto_list_type_name:
          "bonanza.model.analysis.BuildSettingOverride";
      }];

  // The aspects that are applied to the target, in the order in which
  // they are applied. Aspects listed in an aspect's
  // Aspect.Definition.requires MUST precede it in this list. An aspect
  // MUST NOT occur in this list more than once, not even with different
  // parameters.
  //
  // When an aspect is applied to a target, the list of aspects to
  // apply to a target referenced through one of its label attrs is
  // computed as follows:
  //
  // 1. All aspects in this list whose Aspect.Definition.attr_aspects
  //    contains the name of the attr are retained, in the same order.
  // 2. The aspects listed in the attr's LabelOptions.aspects are
  //    appended, each preceded by the aspects it requires through
  //    Aspect.Definition.requires.
  // 3. Aspects that occur more than once with identical parameters
  //    are removed, retaining the first occurrence. It is an error
  //    for an aspect to occur multiple times with different
  //    parameters.
  //
  // Aspects that are listed in Aspect.Definition.toolchains_aspects
  // are propagated to toolchains in a similar way.
  repeated AppliedAspect aspects = 2;
}

message Attr {
  // If set, the attribute is optional, and this field denotes the value
  // that is used if no explicit value is provided. The type of the
  // value must be consistent with the type of this attribute, or it
  // must be a function. If it is a function, it is invoked to compute
  // the default value if none is provided.
  //
  // If not set, the attribute is mandatory.
  Value default = 1;

  // Whether the value of the attribute may be provided using select(),
  // corresponding to the "configurable" parameter of attr.*(). Values
  // of attributes that are not configurable are provided to the
  // implementation functions of symbolic macros as is, as opposed to
  // being wrapped in select().
  //
  // Apart from outputs, which are never configurable, only attributes
  // of symbolic macros may set this field to false.
  bool configurable = 15;

  // Restrictions on the files yielded by targets referenced by an
  // attribute containing labels, corresponding to the "allow_files"
  // and "allow_single_file" parameters of attr.label() and friends.
  message AllowFiles {
    // A nondeterministic finite automaton (NFA) that describes the
    // pattern of package relative paths of files.
    //
    // If set, targets are only accepted if DefaultInfo.files contains
    // at least one file whose package relative path matches the
    // pattern, or a directory. As the DefaultInfo provider of file
    // targets only contains the file itself, this effectively matches
    // the name of file targets against the pattern. This corresponds
    // to setting allow_files to a list of file extensions.
    //
    // Like Bazel, this is merely a sanity check. Files that do not
    // match the pattern are not filtered out, meaning they remain
    // visible through ctx.files.
    //
    // If not set, targets are accepted regardless of the files they
    // yield. This corresponds to allow_files = True.
    bytes filename_pattern = 1;
  }

  // Options that apply to all attribute types containing labels.
  message LabelOptions {
    // Sets of providers that rule targets referenced by this attribute
    // need to provide, corresponding to attr.label(providers = ...). A
    // rule target is accepted if it provides all providers of at least
    // one of the sets. File targets are always accepted, regardless of
    // the providers they yield.
    //
    // As an empty set is satisfied by any target, all rule targets are
    // accepted if this list contains a single empty set. This is the
    // default if no providers are specified. Conversely, if this list
    // is empty, no rule targets are accepted.
    //
    // Unlike Bazel, the deprecated "allow_rules" parameter of
    // attr.label() is not supported. Bazel accepts rule targets whose
    // rule class is listed in "allow_rules", regardless of whether they
    // yield the required providers.
    //
    // Sets are sorted lexicographically by their provider identifiers.
    // No set may be a subset of another set in this list. As any target
    // satisfying a set also satisfies all of its subsets, such sets are
    // redundant. This also means that sets are unique, and that an
    // empty set is the only set in the list if present.
    repeated ProviderSet providers = 1;

    // Identifiers of aspects that need to be applied to the targets
    // referenced by this attribute, in the order in which they are
    // provided to attr.label(aspects = ...). Duplicates are removed.
    // Aspects required by these aspects through
    // Aspect.Definition.requires are not included.
    repeated string aspects = 2;

    // The transition to apply when configuring the target associated
    // with the label.
    Transition cfg = 3;

    // Whether file targets are permitted and which files the targets
    // referenced by this attribute need to yield, corresponding to
    // attr.label(allow_files = ...).
    //
    // If this field is not set, file targets are not permitted. This
    // corresponds to allow_files = False.
    AllowFiles allow_files = 4;
  }

  // Options that apply to all attribute types containing dicts or
  // lists.
  message CompositeOptions {
    // Whether the dict or list can be empty.
    bool allow_empty = 1;
  }

  message IntType {
    // The list of allowed values for this attribute.
    repeated int32 values = 1;
  }

  message IntListType {
    CompositeOptions list_options = 1;
  }

  message LabelType {
    LabelOptions value_options = 1;

    bool allow_none = 2;

    // Only allow targets corresponding to a single file, meaning that
    // DefaultInfo.files contains exactly one file. If set,
    // value_options.allow_files MUST also be set.
    bool allow_single_file = 3;

    // True if the dependency has to be executable. This means the label
    // must refer to an executable file, or to a rule that outputs an
    // executable file.
    bool executable = 4;
  }

  message LabelKeyedStringDictType {
    CompositeOptions dict_options = 1;

    LabelOptions dict_key_options = 2;
  }

  message LabelListType {
    CompositeOptions list_options = 1;

    LabelOptions list_value_options = 2;
  }

  message OutputType {
    // If set, the output is declared using rule(outputs = ...), and the
    // field is set to the template that is used to construct the
    // filename of the output.
    string filename_template = 1;
  }

  message OutputListType {
    CompositeOptions list_options = 1;
  }

  message StringType {
    // The list of allowed values for this attribute.
    repeated string values = 1;
  }

  message StringDictType {
    CompositeOptions dict_options = 1;
  }

  message StringListType {
    CompositeOptions list_options = 1;
  }

  message StringKeyedLabelDictType {
    CompositeOptions dict_options = 1;

    LabelOptions dict_value_options = 2;
  }

  message StringListDictType {
    CompositeOptions dict_options = 1;
  }

  oneof type {
    // Accept bool values.
    google.protobuf.Empty bool = 2;

    // Accept int32 values.
    IntType int = 3;

    // Accept []int32 values.
    IntListType int_list = 4;

    // Accept Label values.
    LabelType label = 5;

    // Accept map[Label]string values.
    LabelKeyedStringDictType label_keyed_string_dict = 6;

    // Accept []Label values.
    LabelListType label_list = 7;

    // Accept string values, denoting the name of an output file.
    OutputType output = 8;

    // Accept []string values, denoting the names of output files.
    OutputListType output_list = 9;

    // Accept string values.
    StringType string = 10;

    // Accept map[string]string values.
    StringDictType string_dict = 11;

    // Accept []string values.
    StringListType string_list = 12;

    // Accept map[string]Label values.
    StringKeyedLabelDictType string_keyed_label_dict = 14;

    // Accept map[string][]string values.
    StringListDictType string_list_dict = 13;
  }
}

message BuildSetting {
  // Whether or not this build setting is callable on the command line.
  bool flag = 1;

  message ListType {
    // If set, instead of expecting a comma-separated value, this flag
    // is allowed to be set multiple times on the command line with each
    // individual value treated as a single string to add to the list
    // value. Insertion order and repeated values are both maintained.
    //
    // This list can be post-processed in the build setting
    // implementation function if different behavior is desired.
    bool repeatable = 1;
  }

  oneof type {
    // Accept bool values.
    google.protobuf.Empty bool = 2;

    // Accept int32 values.
    google.protobuf.Empty int = 3;

    // Accept []Label values.
    ListType label_list = 4;

    // Accept string values.
    google.protobuf.Empty string = 5;

    // Accept []string values.
    ListType string_list = 6;
  }
}

message Depset {
  // Elements contained in the depset.
  //
  // Duplicate elements may exist. These must be suppressed when
  // converting the depset to a list, retaining the first occurrence.
  //
  // If the order of the depset is equal to TOPOLOGICAL, elements in
  // this list are stored in reverse order, for the the reason that the
  // last occurrence must be retained.
  repeated List.Element elements = 1;

  enum Order {
    // Order is unspecified (but deterministic).
    DEFAULT = 0;

    // A left-to-right post-ordering. Precisely, this recursively
    // traverses all children leftmost-first, then the direct elements
    // leftmost-first.
    POSTORDER = 1;

    // A left-to-right pre-ordering. Precisely, this traverses the
    // direct elements leftmost-first, then recursively traverses the
    // children leftmost-first.
    PREORDER = 2;

    // A topological ordering from the root down to the leaves. There is
    // no left-to-right guarantee.
    TOPOLOGICAL = 3;
  }

  // The order that was used to construct combine the direct and
  // transitive elements.
  Order order = 2;

  // Unique identifier of the instance of the depset.
  //
  // As depsets use reference equality, they are only equal to
  // themselves. Bazel implements this by comparing the memory addresses
  // of the depsets. This does not work for Bonanza, as Starlark values
  // can be written to, and read from storage. We therefore need to give
  // each depset its own identifier.
  //
  // This field is left empty for empty depsets. This ensures that all
  // empty depsets are equal to each other.
  bytes identifier = 3;
}

message Dict {
  message Entry {
    message Leaf {
      Value key = 1;
      Value value = 2;
    }

    message Parent {
      bonanza.model.core.DecodableReference reference = 1
          [(bonanza.model.core.object_format) = {
            proto_list_type_name:
              "bonanza.model.starlark.Dict.Entry";
          }];
    }

    oneof level {
      Leaf leaf = 1;
      Parent parent = 2;
    }
  }

  repeated Entry entries = 1;
}

message ExecGroup {
  // Set of constraints on the execution platform, deduplicated and
  // sorted alphabetically.
  repeated string exec_compatible_with = 1;

  // Set of toolchains this execution group requires, deduplicated and
  // sorted alphabetically by ToolchainType.toolchain_type.
  repeated ToolchainType toolchains = 2;
}

message File {
  message Owner {
    // The configuration that is used to build the file. If aspects are
    // provided, the file is not created by the target itself, but by
    // the last aspect in the list, applied to the target after all of
    // the other aspects in the list.
    //
    // Files created by aspects are placed in the same directory as the
    // files created by the target. It is the responsibility of the
    // aspect to pick names that don't collide with those of files
    // created by the target or other aspects.
    TargetVariant variant = 1;

    // Name of the target inside the canonical package that creates
    // this file.
    string target_name = 2;

    enum Type {
      // Regular file declared through ctx.actions.declare_file().
      FILE = 0;

      // Directory declared through ctx.actions.declare_directory().
      DIRECTORY = 1;

      // Symbolic link declared through ctx.actions.declare_symlink().
      SYMLINK = 2;
    }

    // The type of the file.
    Type type = 3;
  }

  // If set, the file is the output of a configured target. Otherwise,
  // it is a source file.
  Owner owner = 1;

  // Canonical package that contains the directory, file or symlink, and
  // its name relative to the package's directory.
  string label = 2;
}

message Function {
  // The canonical label of the .bzl file declaring the function. The
  // code of the function is stored in the CompiledProgram of this file.
  // Globals and predeclared names referenced by the function's code are
  // resolved against this file as well.
  string filename = 1;

  message Name {
    // The name of the function. Left empty for lambdas.
    string name = 1;

    // Zero for the first function having this name in the enclosing
    // function, one for the second, etc. As lambdas have no name, they
    // are simply numbered in the order in which they are declared.
    int32 disambiguation_index = 2;
  }

  // The path of the function within the file. The first element refers
  // to the function at the top level of the file, while any subsequent
  // elements refer to functions nested inside it.
  repeated Name name_path = 2;

  message Closure {
    message DefaultParameter {
      // If set, the parameter is optional, and the default value is
      // provided.
      Value value = 1;
    }

    // Default values of parameters of the function.
    repeated DefaultParameter default_parameters = 1;

    // If the function is a nested function or lambda, the values of free
    // variables.
    repeated Value free_variables = 2;
  }

  // The values of default parameters and free variables of the
  // function. Omitted if the function has neither.
  Closure closure = 3;
}

// The compiled code of a Starlark function, or the top level of a file.
// Each function is stored in a separate object, which refers to the
// objects containing the code of nested functions.
message Funcode {
  // The column of the "def" or "lambda" keyword. Its line is not stored
  // here, so that this message does not change if lines are added to or
  // removed from other parts of the file. It is stored in
  // CompiledProgram.top_level_function_lines for top-level functions,
  // and in NestedFunction.relative_line for nested functions.
  uint32 column = 1;

  // The bytecode of the function.
  bytes code = 2;

  // Delta encoded table containing the source positions of all
  // instructions that can fail, in the order of the bytecode.
  bytes line_table = 3;

  // Constants referred to by the STR instruction. Strings may contain
  // arbitrary bytes, which is why they are not stored as a proto3
  // string.
  repeated bytes string_constants = 4;

  // Constants referred to by the INT instruction, encoded as big-endian
  // two's complement integers.
  repeated bytes int_constants = 5;

  // Constants referred to by the FLOAT instruction.
  repeated double float_constants = 6;

  // Names referred to by attribute, field, global, predeclared and
  // universal name instructions.
  repeated string names = 7;

  // Symbols referred to by the IMPORT instruction, as canonical
  // Starlark identifiers (e.g., "repo+//pkg:defs.bzl%symbol").
  repeated string imports = 8;

  // Names of the local variables. Parameters come first.
  repeated string locals = 9;

  // Indices of local variables that need to be stored in cells, as
  // they are captured by nested functions.
  repeated uint32 cells = 10;

  // Names of the free variables.
  repeated string free_variables = 11;

  // Number of parameters, including *args and **kwargs.
  uint32 num_params = 12;
  uint32 num_keyword_only_params = 13;
  bool has_args = 14;
  bool has_kwargs = 15;

  // Maximum size of the operand stack.
  uint32 max_stack = 16;

  message NestedFunction {
    // The name of the nested function. Left empty for lambdas.
    string name = 1;

    // The code of the nested function.
    Funcode funcode = 2;

    // The line of the "def" or "lambda" keyword, relative to that of
    // the enclosing function.
    uint32 relative_line = 3;
  }

  // Functions nested directly inside this function, in the order in
  // which they are declared, referred to by the MAKEFUNC instruction.
  repeated NestedFunction functions = 17;
}

message InheritableAttrs {
  // Explanatory warning message associated with the target, indicating
  // the reason its use is deprecated.
  string deprecation = 1;

  // Metadata targets. These are typically targets related to OSS
  // package and license declarations.
  repeated string package_metadata = 2;

  // If true, only testonly targets (such as tests) can depend on this
  // target.
  bool testonly = 3;

  // Which targets in other packages are permitted to depend on this
  // target.
  PackageGroup visibility = 4;
}

message LabelSetting {
  // The default label value to use if the setting is not specified.
  // When empty, it indicates that the default value of the label
  // setting is None.
  string build_setting_default = 1;

  // Whether the setting can be controlled via a command line flag.
  bool flag = 2;

  // Even though the build setting can only be set to a single label, as
  // part of user defined transitions it is expected to be a list.
  bool singleton_list = 3;

  // The visibility of the label setting, which may differ from the
  // visibility of the target to which the label setting.
  PackageGroup visibility = 4;
}

message List {
  message Element {
    message Parent {
      // Reference to an object containing additional list elements.
      bonanza.model.core.DecodableReference reference = 1
          [(bonanza.model.core.object_format) = {
            proto_list_type_name:
              "bonanza.model.starlark.List.Element";
          }];

      // The total number of leaf elements in the list that is
      // referenced. If the total number of leaf elements exceeds
      // 2^64-1, the count should be clamped to that value. This may
      // happen for depsets, which may contain a lot of repetition.
      uint64 count = 2;
    }

    oneof level {
      Value leaf = 1;
      Parent parent = 2;
    }
  }

  repeated Element elements = 1;
}

message Macro {
  message Definition {
    // Attributes of the macro, sorted by name. The "name" and
    // "visibility" attributes are implicit, and are not listed.
    repeated NamedAttr attrs = 1;

    // Starlark function that implements this macro.
    Function implementation = 2;

    // Whether the macro is a finalizer, meaning it is evaluated after
    // all other targets in the package have been declared.
    bool finalizer = 3;
  }

  oneof kind {
    // Canonical identifier of a macro that is declared elsewhere.
    string reference = 1;

    // Definition of the macro, if the value is the canonical location
    // of the macro.
    Definition definition = 2;
  }
}

// MacroExpansionContext contains all of the information that is needed
// to expand a macro instance, meaning its implementation function can
// be invoked to obtain the targets and macro instances that it
// declares.
message MacroExpansionContext {
  // The suffix that needs to be appended to the name of the macro
  // instance whose expansion yielded this macro expansion context to
  // obtain the name of the macro instance to expand. For macro
  // expansion contexts yielded by the top level of a package, this is
  // equal to the name of the macro instance.
  //
  // All targets and macro instances declared by the macro instance
  // have a name that is equal to its name, or is prefixed by it,
  // followed by "_", "-" or ".".
  string name_suffix = 1;

  message Definition {
    // The arguments with which the macro instance to expand was
    // invoked.
    MacroInstance.Definition root_macro_instance_definition = 1;

    // The fields below contain names in the namespace of the macro
    // instance. A name is said to be part of a namespace if it is
    // equal to the namespace's name, or prefixed by it, followed by
    // "_", "-" or ".". Names are stored without the name of the macro
    // instance as a prefix (e.g., "_gen.h" for target "foo_gen.h" in
    // the namespace of macro instance "foo").

    // Targets in the namespace of the macro instance that are
    // referenced outside of the macro instance, but are not declared
    // outside of it. The macro instance may declare these targets. If
    // it doesn't, they are source files. This field is sorted
    // alphabetically, free of duplicates, and disjoint with
    // forbidden_target_name_suffixes.
    repeated string referenced_target_name_suffixes = 2;

    // Names of targets that are declared outside of the macro
    // instance, but are part of its namespace. Lookups of these
    // targets don't expand the macro instance, meaning that it may not
    // declare targets having these names. This field is sorted
    // alphabetically and free of duplicates.
    repeated string forbidden_target_name_suffixes = 3;

    // Macro instances that are declared outside of the macro instance,
    // and whose namespace is contained within the namespace of the
    // macro instance. When expanding the macro instance, these are
    // treated as if the macro instance declared them. This ensures
    // that the namespaces of the macro expansion contexts yielded by a
    // single expansion are disjoint, meaning that targets can be
    // looked up by expanding at most a single macro instance at every
    // level.
    //
    // As a consequence, the macro instance may declare targets that
    // are part of the namespaces of these macro instances. If it does,
    // these macro instances may not declare targets having the same
    // names. The macro instance may not declare macro instances having
    // the same names as these macro instances.
    //
    // The name suffixes of these macro instances are relative to the
    // name of the macro instance to expand.
    repeated MacroInstance.Entry nested_macro_instances = 4;
  }

  // The information that is needed to expand the macro instance.
  Definition definition = 2;

  // Entry is an element of a B-tree containing macro expansion
  // contexts, sorted by name suffix. Prior to comparing name suffixes
  // byte by byte, "-", ".", and "_" are mapped to 0, 1, and 2,
  // respectively, while all other bytes are mapped to 3 to 255,
  // retaining their relative order.
  //
  // This order causes the namespace of a macro instance to be a
  // contiguous range of names, starting at the name of the macro
  // instance. As the namespaces of the macro instances in the B-tree
  // are disjoint, the macro instance whose namespace contains a given
  // name can be found by looking up the macro instance whose name
  // suffix precedes the name.
  message Entry {
    message Parent {
      // Reference to an object containing additional macro expansion
      // contexts.
      bonanza.model.core.DecodableReference reference = 1
          [(bonanza.model.core.object_format) = {
            proto_list_type_name:
              "bonanza.model.starlark.MacroExpansionContext.Entry";
          }];

      // The name suffix of the first macro expansion context contained
      // in this B-tree. This field can be used to efficiently look up
      // macro expansion contexts contained in the B-tree.
      string first_name_suffix = 2;
    }

    oneof level {
      // A single macro expansion context.
      MacroExpansionContext leaf = 1;

      // More macro expansion contexts are stored in another object.
      Parent parent = 2;
    }
  }
}

// MacroInstance contains the arguments with which a symbolic macro was
// invoked. Macro instances are expanded lazily. Their implementation
// function is only invoked when one of the targets declared by them is
// requested.
message MacroInstance {
  enum Finalizer {
    // The macro is not a finalizer, and the macro instance is not
    // declared while expanding a finalizer.
    NOT_A_FINALIZER = 0;

    // The macro is a finalizer.
    FINALIZER = 1;

    // The macro is not a finalizer, but the macro instance is declared
    // while expanding a finalizer, or while expanding another macro
    // instance that is declared while expanding a finalizer.
    CALLED_BY_FINALIZER = 2;
  }

  message Definition {
    // Canonical identifier of the macro.
    string macro_identifier = 1;

    // Values of the public attributes of the macro whose values were
    // provided explicitly or were set to None, in the same order as the
    // attributes of the macro definition. Values are stored as a
    // sequence of select() expressions whose values need to be
    // summed/concatenated.
    repeated RuleTarget.PublicAttrValue public_attr_values = 2;

    // Values of attributes that should be inherited by targets declared
    // by the macro, as declared by the package.
    //
    // Field "visibility" contains the visibility of the macro instance,
    // which is provided to the macro's implementation function through
    // the "visibility" argument. In addition to the packages that were
    // provided explicitly, it includes the location from which the macro
    // was invoked. Unlike the other fields, it is not inherited by the
    // targets declared by the macro, as these are only visible to the
    // package containing the macro's definition by default.
    InheritableAttrs inheritable_attrs = 3;

    // Whether the macro is a finalizer, or whether the macro instance
    // is declared while expanding a finalizer. Finalizers are expanded
    // after all targets declared by non-finalizer macro instances in
    // the package have been declared. This means that unless they are
    // declared while expanding a finalizer, the namespace of a
    // finalizer may not contain non-finalizer macro instances. Only
    // finalizers may call native.existing_rule() and
    // native.existing_rules().
    Finalizer finalizer = 4;
  }

  // The suffix that needs to be appended to the name of the macro
  // instance whose macro expansion context contains this macro
  // instance to obtain its name.
  string name_suffix = 1;

  // The arguments with which the macro was invoked.
  Definition definition = 2;

  // Entry is an element of a B-tree containing macro instances,
  // sorted alphabetically by name suffix.
  message Entry {
    message Parent {
      // Reference to an object containing additional macro instances.
      bonanza.model.core.DecodableReference reference = 1
          [(bonanza.model.core.object_format) = {
            proto_list_type_name:
              "bonanza.model.starlark.MacroInstance.Entry";
          }];
    }

    oneof level {
      // The arguments of a single macro instance.
      MacroInstance leaf = 1;

      // More macro instances are stored in another object.
      Parent parent = 2;
    }
  }
}

message ModuleExtension {
  message NamedTagClass {
    // The name that can be used to declare tags of this class in
    // MODULE.bazel.
    string name = 1;

    // The attributes that can be provided to tags of this class.
    TagClass tag_class = 2;
  }

  // Starlark function that implements this module extension.
  Function implementation = 1;

  // List of tag classes that are provided by the module extension.
  // These tag classes may be invoked from within MODULE.bazel.
  repeated NamedTagClass tag_classes = 2;
}

message PredeclaredOutputFileTarget {
  // The name of the target in the current package that has declared
  // this file being one of its outputs.
  string owner_target_name = 1;
}

message PackageGroup {
  message Package {
    // At the root level, the canonical repo for which inclusion is
    // specified. For the levels below, a directory name of the
    // package path.
    string component = 1;

    // If set, include the current package in this group.
    bool include_package = 2;

    // Data on whether subpackages are part of the package group. This
    // field MUST be set, even if no subpackages are included.
    Subpackages subpackages = 3;
  }

  message Subpackages {
    message Overrides {
      repeated Package packages = 1;
    }

    // If set, include all direct or transitive subpackages of the
    // current package in this group.
    bool include_subpackages = 1;

    // If set, the package contains one or more direct or transitive
    // subpackages whose inclusion differs from include_subpackages.
    oneof overrides {
      // Set if there are too many overrides to store in the current
      // object.
      bonanza.model.core.DecodableReference overrides_external = 2
          [(bonanza.model.core.object_format) = {
            proto_type_name:
              "bonanza.model.starlark.PackageGroup.Subpackages.Overrides";
          }];

      // Set if there are only few overrides.
      Overrides overrides_inline = 3;
    }
  }

  // Tree of packages that are included in this package group, stored in
  // the form of a tree.
  Subpackages tree = 1;

  // Alphabetically sorted list of package groups that should be merged
  // into this one.
  repeated string include_package_groups = 2;
}

message Provider {
  message InstanceProperties {
    // Canonical starlark identifier of the provider that was used to
    // create this struct.
    string provider_identifier = 1;

    // If set, the fields in this struct can also be accessed using
    // square brackets and the "in" binary operator.
    bool dict_like = 2;

    message ComputedField {
      // The name of the field to add to the struct.
      string name = 1;

      // The function to invoke to compute the value of the field. This
      // function is called with a single positional argument containing
      // the value of the struct.
      Function function = 2;
    }

    // Additional fields to add to instances of this provider whose
    // values can be computed using the explicitly provided fields.
    //
    // This feature can be used to add fields to structs that are not
    // hashable (lists, functions), without losing the ability to hash
    // the struct itself. This is needed to properly implement types
    // such as LibraryToLink.
    repeated ComputedField computed_fields = 3;

    // If non-empty, let type(v) return the provided string value.
    string type_name = 4;
  }

  // Properties that affect the behavior of structs that are created
  // through this provider.
  InstanceProperties instance_properties = 1;

  // Initialization function that should be invoked to mutate fields
  // prior to constructing provider instances.
  Function init_function = 2;

  // If non-empty, restrict the set of allowed fields. Field names are
  // provided in alphabetical order.
  repeated string fields = 3;
}

message Struct {
  message Fields {
    // The names of the fields in the struct, listed in alphabetical
    // order.
    repeated string keys = 1;

    // List of values of the fields, stored in the same order as the
    // keys.
    repeated List.Element values = 2;
  }

  // The fields contained within the struct.
  Fields fields = 1;

  // If set, the struct was created not by invoking struct(), but by
  // calling into a provider.
  Provider.InstanceProperties provider_instance_properties = 2;
}

message TagClass {
  // Attributes of the tag class, sorted by name.
  repeated NamedAttr attrs = 1;
}

message TargetReference {
  // Resolved label of the target prior to expanding aliases.
  string original_label = 1;

  message Configured {
    // Canonical label of the target after expanding aliases.
    string label = 1;

    // Providers of the target, sorted by provider identifier.
    repeated Struct providers = 2;
  }

  // If set, the target has been configured. meaning it is possible to
  // access its providers.
  Configured configured = 2;
}

// A set of providers, all of which need to be present.
message ProviderSet {
  // Identifiers of the providers, sorted alphabetically. If empty, the
  // set is satisfied by any target.
  repeated string provider_identifiers = 1;
}

message ToolchainType {
  // Label of the toolchain.
  string toolchain_type = 1;

  // Whether the rule considers the toolchain to be mandatory or
  // optional.
  bool mandatory = 2;
}

message Tuple {
  repeated Value elements = 1;
}

message NamedAttr {
  // The name of the attribute.
  string name = 1;

  // The properties of the attribute.
  Attr attr = 2;
}

message NamedExecGroup {
  // The name of the execution group. The empty string is used to denote
  // the target's default execution platform.
  string name = 1;

  // The properties of the execution group.
  ExecGroup exec_group = 2;
}

message Repo {
  message Definition {
    // Identifier of the repository rule used by this target.
    string repository_rule_identifier = 1;

    // Repository rule specific attributes whose values were provided
    // explicitly.
    Struct.Fields attr_values = 2;
  }

  // Name of the repo within the module extension.
  string name = 1;

  Definition definition = 2;
}

message RepositoryRule {
  message Definition {
    // Attributes of the repository rule, sorted by name.
    repeated NamedAttr attrs = 1;

    // Starlark function that implements this rule.
    Function implementation = 2;
  }

  oneof kind {
    string reference = 1;

    Definition definition = 2;
  }
}

message Rule {
  message Definition {
    // Attributes of the rule, sorted by name.
    repeated NamedAttr attrs = 1;

    // If set, describes what kind of build setting this rule is. A
    // mandatory attribute named build_setting_default is automatically
    // added to this rule, with a type corresponding to that of the
    // build setting.
    BuildSetting build_setting = 2;

    // If set, the identifier of the user-defined transition to apply to
    // its own configuration before analysis.
    Transition.UserDefined cfg_transition = 3;

    // Execution groups of the rule, sorted by name.
    repeated NamedExecGroup exec_groups = 4;

    // Starlark function that implements this rule.
    Function implementation = 5;

    // Stalark function initializing the attributes of the rule.
    Function initializer = 6;

    // List of providers that the implementation function must return,
    // sorted by name.
    repeated string provides = 7;

    enum Type {
      // Targets of this rule cannot be run (e.g., libraries).
      NON_EXECUTABLE = 0;

      // Targets of this rule can be run using "bazel run" (e.g.,
      // binaries). This corresponds to calling rule() with
      // executable=True.
      EXECUTABLE = 1;

      // Targets of this rule are tests, which can be run using
      // "bazel test" or "bazel run". This corresponds to calling
      // rule() with test=True. Such rules are executable as well,
      // regardless of whether executable=True is provided.
      TEST = 2;
    }

    // Whether targets of this rule can be run.
    Type type = 8;

    // Identifiers of subrules that may be invoked by the implementation
    // function of this rule, sorted alphabetically.
    repeated string subrule_identifiers = 9;
  }

  oneof kind {
    string reference = 1;

    Definition definition = 2;
  }
}

message RuleTarget {
  message PublicAttrValue {
    // The value of the attribute, in the form of a sequence of select()
    // expressions whose values need to be summed/concatenated.
    repeated Select.Group value_parts = 2;
  }

  // Identifier of the rule used by this target.
  string rule_identifier = 1;

  // Values of public attributes that were provided as arguments. The
  // length of this list MUST match the number of public attributes of
  // the rule.
  repeated PublicAttrValue public_attr_values = 2;

  // A list of constraint_values that must be present in the execution
  // platform for this target. This is in addition to any constraints
  // already set by the rule type. Constraints are used to restrict the
  // list of available execution platforms.
  repeated string exec_compatible_with = 3;

  // Tags that were attached to the target, sorted alphabetically.
  repeated string tags = 4;

  // A list of constraint_values that must be present in the target
  // platform for this target to be considered compatible. This is in
  // addition to any constraints already set by the rule type. If the
  // target platform does not satisfy all listed constraints then the
  // target is considered incompatible.
  repeated Select.Group target_compatible_with = 5;

  // Attributes on rule targets that are inherited from calls to repo()
  // in REPO.bazel and package() in BUILD.bazel.
  InheritableAttrs inheritable_attrs = 6;

  // If set, the rule used by this target is a build setting, and the
  // default value if the build setting is not set explicitly is
  // provided.
  Value build_setting_default = 7;

  message Test {
    // The size of the test, corresponding to the "size" attribute.
    TestSize size = 1;

    // The timeout of the test, corresponding to the "timeout"
    // attribute. If the attribute is not set, this field contains
    // the timeout that corresponds to the size of the test.
    TestTimeout timeout = 2;

    // Whether the test is flaky, corresponding to the "flaky"
    // attribute.
    bool flaky = 3;

    // Whether the test needs to run locally, corresponding to the
    // "local" attribute.
    bool local = 4;

    // The number of shards to use to run the test, corresponding to
    // the "shard_count" attribute. The value of each group is an int.
    // No bounds checking is performed on it.
    repeated Select.Group shard_count = 5;

    // Command line arguments to pass to the test, corresponding to
    // the "args" attribute. The value of each group is a list of
    // strings.
    repeated Select.Group args = 6;
  }

  // If set, the rule used by this target provides a test, and the
  // values of attributes that are specific to tests are provided.
  Test test = 8;
}

// The size of a test, which is used to determine its default timeout,
// and can be used to select tests to run.
enum TestSize {
  SMALL = 0;
  MEDIUM = 1;
  LARGE = 2;
  ENORMOUS = 3;
}

// The maximum amount of time a test is permitted to run.
enum TestTimeout {
  SHORT = 0;
  MODERATE = 1;
  LONG = 2;
  ETERNAL = 3;
}

// A group of tests, declared using test_suite().
message TestSuite {
  // Test is an element of a B-tree containing the labels of the tests
  // and test suites that are part of a test suite.
  message Test {
    message Parent {
      // Reference to an object containing additional labels.
      bonanza.model.core.DecodableReference reference = 1
          [(bonanza.model.core.object_format) = {
            proto_list_type_name:
              "bonanza.model.starlark.TestSuite.Test";
          }];
    }

    oneof level {
      // The resolved label of a test or test suite.
      string leaf = 1;

      // More labels are stored in another object.
      Parent parent = 2;
    }
  }

  // Labels of the tests and test suites that are part of this test
  // suite, as provided through the "tests" attribute. If no tests
  // are provided, this field contains all tests in the current
  // package that are not tagged "manual" and pass the filters of the
  // test suite.
  //
  // As this list may be large, it is stored as a B-tree. Labels are
  // sorted alphabetically and deduplicated.
  repeated Test tests = 1;

  // Tags that tests need to have to be part of this test suite,
  // corresponding to tags of the test suite that are not prefixed
  // with "-". Tags corresponding to test sizes and the "manual" tag
  // are stored separately.
  //
  // Tags are sorted alphabetically and deduplicated, and MUST NOT
  // overlap with negative_tags.
  repeated string positive_tags = 2;

  // Tags that tests MUST NOT have to be part of this test suite,
  // corresponding to tags of the test suite that are prefixed with
  // "-". Tags corresponding to test sizes are stored separately.
  //
  // Tags are sorted alphabetically and deduplicated, and MUST NOT
  // overlap with positive_tags.
  repeated string negative_tags = 3;

  // Sizes that tests need to have to be part of this test suite. Like
  // Bazel, test sizes are treated as tags of tests. If the tags of the
  // test suite contain a test size, only tests of that size are
  // included. Sizes prefixed with "-" are excluded.
  //
  // Sizes are sorted and deduplicated. This list MUST NOT be empty. If
  // no restrictions on test sizes are in place, all sizes are listed.
  repeated TestSize sizes = 4;

  // Which targets in other packages are permitted to depend on this
  // test suite.
  PackageGroup visibility = 5;

  // Whether the test suite is tagged "manual", meaning that it is not
  // matched by wildcard target patterns. This has no effect on which
  // tests are part of the test suite.
  bool manual = 6;
}

message Select {
  message Condition {
    string condition_identifier = 1;
    Value value = 2;
  }

  message Group {
    // Conditions that are present in the select() expression, sorted
    // alphabetically by condition identifier.
    repeated Condition conditions = 1;

    oneof no_match {
      // If none of the conditions match, yield a given value.
      Value no_match_value = 2;

      // If none of the conditions match, return a custom error message
      // to return to the user.
      string no_match_error = 3;
    }
  }

  enum ConcatenationOperator {
    NONE = 0;
    PIPE = 1;
    PLUS = 2;
  }

  // Non-empty list of groups of select() expressions that have been
  // concatenated using the pipe ("|") or plus ("+") operators.
  repeated Group groups = 1;

  // If there are multiple groups, the operator that was used to
  // concatenate.
  ConcatenationOperator concatenation_operator = 2;
}

message Set {
  repeated List.Element elements = 1;
}

message SourceFileTarget {
  // Visibility of the file target.
  PackageGroup visibility = 4;
}

message Subrule {
  message Definition {
    // Attributes of the subrule, sorted by name.
    repeated NamedAttr attrs = 1;

    // Starlark function that implements this subrule.
    Function implementation = 2;

    // Identifiers of subrules that may be invoked by the implementation
    // function of this rule, sorted alphabetically.
    repeated string subrule_identifiers = 3;
  }

  oneof kind {
    string reference = 1;

    Definition definition = 2;
  }
}

message Target {
  message Definition {
    oneof kind {
      // Reference to another target.
      Alias alias = 1;

      // Build setting having a label value.
      LabelSetting label_setting = 2;

      // Group of packages, used to control visibility of targets.
      PackageGroup package_group = 3;

      // Predeclared output file of a rule target, referenced by an attr
      // of type output or output_list, or as part of the rule
      // definition through rule(outputs = ...).
      PredeclaredOutputFileTarget predeclared_output_file_target = 4;

      // Buildable target backed by a rule.
      RuleTarget rule_target = 5;

      // File exposed via exports_files() or referenced by a rule
      // target's attribute.
      SourceFileTarget source_file_target = 6;

      // Group of tests, declared using test_suite().
      TestSuite test_suite = 7;
    }
  }

  // Name of the target within the package.
  string name = 1;

  Definition definition = 2;
}

message Transition {
  message UserDefined {
    message Definition {
      // Starlark function that implements this transition.
      Function implementation = 1;

      // List of build settings that can be read by this transition. This
      // becomes the key set of the settings parameter of the
      // implementation function parameter.
      //
      // Entries in this list SHOULD be deduplicated and sorted
      // alphabetically.
      repeated string inputs = 2;

      // List of build settings that can be written by this transition.
      // This must be a superset of the key set of the dictionary returned
      // by this transition.
      //
      // Entries in this list SHOULD be deduplicated and sorted
      // alphabetically.
      repeated string outputs = 3;

      // The canonical package in which the transition was declared. The
      // name of the package is used to resolve the input and output
      // labels.
      string canonical_package = 4;
    }

    oneof kind {
      string identifier = 1;

      Definition definition = 2;
    }
  }

  oneof kind {
    // Transition to the platform of the named execution group.
    string exec_group = 1;

    // Apply a transition which removes all configuration, unsetting
    // all flags. Intended for the case where a dependency is
    // data-only and contains no code that needs to be built, but
    // should only be analyzed once.
    google.protobuf.Empty none = 2;

    // Don't perform any transition.
    google.protobuf.Empty target = 3;

    // User-defined transition.
    UserDefined user_defined = 4;

    // Leave the target unconfigured.
    //
    // If this option is set, then any labels will appear as target
    // references having no providers. The label associated with the
    // target reference will also not be subject to alias expansion.
    //
    // This transition can be used by rules like toolchain() to ensure
    // that the underlying toolchain is only configured upon use.
    google.protobuf.Empty unconfigured = 5;
  }
}
