syntax = "proto3";

package bonanza.storage.object.local;

import "google/protobuf/timestamp.proto";

option go_package = "bonanza.build/pkg/proto/storage/object/local";

message EpochState {
  // The randomized hash seed of the current epoch. The hash seed is
  // necessary to validate the integrity of reference-location map
  // entries.
  fixed64 hash_seed = 1;

  // The total number of bytes by which the offset at which locations to
  // store objects was increased during this epoch.
  uint64 location_increase = 2;
}

message LocationTimelineEntry {
  // The location at which data was being written.
  uint64 location = 1;

  // The point in time at which writing data at this location started.
  // All data stored at this location or after it was written at or
  // after this time.
  google.protobuf.Timestamp time = 2;
}

message LeaseTrackingState {
  // Points in time at which data was written to locations covered by
  // the epochs. These are used to compute leases of objects ("safe
  // since" timestamps) and the watermark of the store.
  repeated LocationTimelineEntry location_timeline = 1;

  // The highest watermark that was reported by the store. Watermarks
  // never decrease, even across restarts.
  google.protobuf.Timestamp watermark = 2;

  // The incarnation of the storage server, as reported through
  // bonanza.storage.object.GetWatermarkResponse.incarnation. It is
  // preserved across clean restarts. A new incarnation is generated if
  // this message is absent.
  bytes incarnation = 3;

  // The last value of
  // bonanza.storage.object.LeaseValidationContext.incarnations_hash
  // that was received by the storage server. If the first request
  // received after a restart contains a different value, the
  // incarnation of another storage server in the cluster changed while
  // this storage server was offline.
  bytes last_incarnations_hash = 4;
}

message PersistentState {
  // The minimum epoch ID for which entries in the reference-location
  // map may be interpreted. The next usable epoch ID can be computed as
  // follows:
  //
  //     next_epoch_id = minimum_epoch_id + len(epochs)
  uint32 minimum_epoch_id = 1;

  // The minimum location for which entries in the reference-location
  // map may be interpreted. The next usable location for writing new
  // objects can be computed as follows:
  //
  //     next_location = minimum_location +
  //                     sum(s.location_increase for s in epochs)
  uint64 minimum_location = 2;

  // The randomized hash seed that is used by the reference-location
  // map. It needs to be preserved to ensure entries created by previous
  // invocations can still be located.
  uint64 reference_location_map_hash_initialization = 3;

  // Epochs for which entries in the reference-location map exist that
  // may point to valid locations in the objects block device.
  //
  // As epochs for which all entries in the reference-location map have
  // expired are automatically removed, the following expression should
  // not yield a value that exceeds the size of the block device:
  //
  //     sum(s.location_increase for s in epochs)
  repeated EpochState epochs = 4;

  // State needed to compute leases of objects and the watermark of the
  // store. This field is only set if lease tracking is enabled (i.e.,
  // when the store is used by a storage shard), and the persistent
  // state was written as part of a clean shutdown. Upon startup, this
  // field is cleared on disk before any leases are handed out.
  //
  // If this field is not set, data written after the persistent state
  // was written may have been lost, even though leases for it may have
  // been handed out. The watermark is then raised to the time of the
  // restart, invalidating all leases of existing objects.
  LeaseTrackingState lease_tracking = 5;
}
