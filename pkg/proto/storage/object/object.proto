edition = "2024";

package bonanza.storage.object;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "bonanza.build/pkg/proto/storage/object";

// Object Store is a content addressed data store that is capable of
// storing binary objects that are between 1 byte and 2 MiB in size. The
// 2 MiB limit is chosen specifically because gRPC has a default maximum
// message size limit of 4 MiB. This means that any object can be
// transmitted via gRPC using a single message.
//
// To store data sets that are larger than 2 MiB in size (e.g., large
// files or directory hierarchies), objects may contain outgoing
// references to other objects. Due to references containing
// cryptographic hashes, they cannot be cyclic. Objects therefore
// collectively form a forest of Directed Acyclic Graphs (DAGs). In
// order to make Object Store aware of these references while remaining
// oblivious of an object's actual data format, outgoing references are
// stored at the beginning of the object, as shown in the diagram below:
//
// <---------------------------- object -------------------------------->
// +-------------+-------------+-----+---------------+------------------+
// | reference 0 | reference 1 | ... | reference n-1 | freeform payload |
// +-------------+-------------+-----+---------------+------------------+
//
// Outgoing references are stored consecutively without any framing or
// padding, and MUST use the same format as the reference of the object
// itself. For a given object, outgoing references MUST be unique and
// sorted by their binary representation. This is done to ensure that
// the graph structure of objects reveals less information about the
// data being stored, which is important if payloads are encrypted.

service Downloader {
  // Download the contents of a single object from storage by providing
  // a reference.
  rpc DownloadObject(DownloadObjectRequest) returns (DownloadObjectResponse);
}

service Uploader {
  // Upload the contents of a single object to storage and/or attach
  // leases of outgoing references to it.
  rpc UploadObject(UploadObjectRequest) returns (UploadObjectResponse);

  // Obtain the watermark of the storage server. All objects written to
  // the server at or after the watermark are still present. Leases of
  // objects are timestamps, and are only valid if they are not below
  // the watermark.
  //
  // Storage frontends call this method periodically against all
  // storage shards, and provide the resulting watermark of each cluster
  // as part of LeaseValidationContext.
  rpc GetWatermark(google.protobuf.Empty) returns (GetWatermarkResponse);
}

message ReferenceFormat {
  export enum Value {
    // Invalid value.
    UNKNOWN = 0;

    // References that are 40 bytes (320 bits) in size, containing fields
    // stored in the order listed below:
    //
    // - hash: SHA-256 hash of the object, stored as 32 bytes of binary
    //   data.
    //
    // - size_bytes: Size of the object in bytes, stored as a 24-bit
    //   little endian integer.
    //
    // - height: Height of the object, stored as an 8-bit integer. The
    //   height is zero iff the degree is zero as well.
    //
    // - degree: Degree of the object (i.e., the number of outgoing
    //   references), stored as a 16-bit little endian integer.
    //
    // - maximum_total_parents_size_bytes: Maximum total size of all
    //   parent objects in any path in the tree rooted at the object,
    //   excluding the root object itself. The total size is stored as a
    //   16-bit little endian floating point value, having the following
    //   two fields:
    //
    //   - An exponent that is stored in the top 5 bits.
    //   - A significand that is stored in the bottom 11 bits.
    //
    //   When the exponent is zero, the value is a subnormal number.
    //   When the exponent is non-zero, the value is a normal number.
    //   Unlike IEEE 754 floating point numbers, no exponent is reserved
    //   to indicate infinity, nor is there a sign bit present.
    //
    //   The exponent bias is chosen such that the smallest subnormal
    //   number is equal to integer value 1. The smallest normal number
    //   is thus equal to integer value 2048, while the largest normal
    //   number is equal to 0xfff << 30 == 4396972769280.
    //
    //   This value MUST be computed by adding the size_bytes and
    //   maximum_total_parents_size_bytes fields of each outgoing
    //   reference to a parent object without any loss of precision,
    //   selecting the largest value, and converting the result back to
    //   a floating point value rounding upwards.
    SHA256_V1 = 1;
  }
}

message Namespace {
  // The instance of the execution system to operate against. A server
  // may support multiple instances of the execution system (with their
  // own workers, storage, caches, etc.). The server MAY require use of
  // this field to select between them in an implementation-defined
  // fashion, otherwise it can be omitted.
  //
  // Implementations MAY place restrictions on the format of the
  // instance name string (e.g., requiring them to be path-like).
  string instance_name = 1;

  // The format that is used to encode references.
  ReferenceFormat.Value reference_format = 2;
}

message DownloadObjectRequest {
  // The namespace from which to download the object.
  bonanza.storage.object.Namespace namespace = 1;

  // Reference of the object to download.
  bytes reference = 2;
}

message DownloadObjectResponse {
  // The contents of the object that was requested.
  bytes contents = 1;
}

message UploadObjectRequest {
  // The namespace to which to upload the object.
  bonanza.storage.object.Namespace namespace = 1;

  // Reference of the object to upload.
  bytes reference = 2;

  // The contents of the object. A client may leave this field unset if
  // it only wants to update the leases of the outgoing references of
  // the object. In that case the server may return NOT_FOUND errors if
  // the provided object does not already exist.
  bytes contents = 3;

  // Leases of objects associated with each of the outgoing references.
  // The size of the list MUST be equal to the degree of the object.
  // However, if the caller is only interested in obtaining the lease of
  // the object itself, it MAY leave this field unset.
  //
  // If elements in this list are empty, the client indicates that it
  // does not want to update the lease associated with the outgoing
  // reference. If the size of the request exceeds the maximum supported
  // by the gRPC server, the client may be forced to call UploadObject()
  // repeatedly, providing leases of outgoing references in batches.
  repeated bytes outgoing_references_leases = 4;

  // If set, it indicates that the client is not in the possession of
  // the contents of the object. If the server returns an 'incomplete'
  // response, it MUST also return the contents. That way the client can
  // attempt to obtain leases for the outgoing references.
  //
  // Clients MUST NOT set this field if the provided reference has a
  // degree of zero, or if UploadObjectRequest.contents is set.
  bool want_contents_if_incomplete = 5;

  // Information needed by the storage shard to validate leases.
  //
  // This field is mandatory. The Uploader service is only exposed by
  // storage shards, and only called by storage frontends.
  LeaseValidationContext lease_validation_context = 6;
}

message UploadObjectResponse {
  message Complete {
    // The lease of the object that was uploaded.
    bytes lease = 1;
  }

  message Incomplete {
    // The contents of the object. This field is only set if
    // UploadObjectRequest.want_contents_if_incomplete is set.
    bytes contents = 1;

    // A non-empty list of indices of outgoing references of the object
    // for which leases are either not present or expired. The caller is
    // expected to call UploadObject() again, providing leases for these
    // outgoing references.
    //
    // The indices MUST be unique and returned in sorted order.
    repeated uint32 want_outgoing_references_leases = 2;
  }

  oneof type {
    // The contents of the object are present, and leases of all
    // outgoing references are valid.
    Complete complete = 1;

    // The contents of the object are present, but the leases of one or
    // more outgoing references are either not present or expired.
    //
    // This field can only be set if the provided reference has a degree
    // greater than zero.
    Incomplete incomplete = 2;
  }
}

message GetWatermarkResponse {
  // The watermark of the storage server.
  Watermark watermark = 1;

  // An opaque value that identifies the instance of the storage server.
  // A new incarnation is generated every time the storage server starts
  // without having access to the state needed to hand out leases of
  // existing objects (e.g., after an unclean shutdown, or when starting
  // with empty storage). The incarnation remains unchanged across
  // clean restarts.
  //
  // Multiple instances of the same storage server may be online at the
  // same time (e.g., briefly during a rolling upgrade on Kubernetes).
  // Objects uploaded to one of these instances may not be present on
  // the other, and will be lost once the former goes offline. As leases
  // of these objects may be newer than the watermark of the latter,
  // watermarks alone cannot be used to detect that these leases are
  // invalid. Incarnations allow this to be detected.
  bytes incarnation = 2;
}

// The watermark of one or more storage servers. All objects written to
// these storage servers at or after the watermark are still present.
//
// Storage servers report their own watermark through GetWatermark().
// Storage frontends combine the
// watermarks of all storage servers in a cluster into a single watermark by
// taking the highest value of field 'watermark' and the lowest value of field
// 'obtained_at', and provide it to storage servers as part of their requests.
//
// A cluster consists of all storage servers across which the key
// space is partitioned. As objects may reference objects stored on
// other storage servers in the cluster, leases need to be checked
// against the watermark of the cluster as a whole.
message Watermark {
  // The watermark. Just like leases, the watermark is computed using
  // the clocks of storage servers. If not set, none of the storage
  // servers have lost any data yet.
  google.protobuf.Timestamp watermark = 1;

  // The time at which the watermark was obtained, according to the
  // clocks of storage servers.
  //
  // Storage servers reject requests if the time elapsed since then
  // exceeds the amount of time they account for when computing their
  // own watermark, as data may have been lost in the meantime. This
  // happens if a storage frontend is unable to obtain the watermark of
  // one of the storage servers for an extended period of time.
  //
  // As all timestamps in this message are computed by storage servers,
  // only the clocks of storage servers need to be synchronized. The
  // clocks of storage frontends are not used.
  google.protobuf.Timestamp obtained_at = 2;
}

// Information that storage frontends provide as part of requests that
// cause storage servers to hand out, store or check leases.
message LeaseValidationContext {
  // The watermark of the cluster that is known to the storage
  // frontend. As objects may reference objects stored on other storage
  // servers, storage servers need to check leases against this
  // watermark, as opposed to just their own.
  //
  // Storage servers keep track of the highest value they have
  // received, meaning that storage frontends providing a lower value
  // do not cause leases to be accepted that are known to be invalid.
  // Requests providing a watermark that is too old are rejected with
  // UNAVAILABLE, as storage servers cannot rule out that data was lost
  // in the meantime.
  Watermark watermark = 1;

  // A hash of the layout of the cluster's key space and the
  // incarnations of all storage servers in the cluster, computed by
  // taking the SHA-256 hash of an IncarnationsHashInput message.
  //
  // Storage servers keep track of the last value they received. If a
  // request contains a different value, either the layout of the key
  // space or the incarnation of at least one storage server in the
  // cluster has changed, meaning objects referenced by existing leases
  // may no longer be present on the storage servers to which they are
  // assigned. Storage servers then raise their own watermark to the
  // current time, invalidating all existing leases. This is done
  // before any leases are checked as part of the request.
  //
  // Storage servers observe changes at slightly different points in
  // time. As leases renewed right after such a raise are close to the
  // watermark, storage servers that raised the watermark to different
  // values may disagree on whether they are valid. Raising their own
  // watermark, as opposed to that of the cluster, causes the raise to
  // be reported through GetWatermark(), so that storage frontends
  // propagate the highest value to all storage servers.
  //
  // While multiple instances of a storage server are online, storage
  // frontends may observe different instances, causing storage servers
  // to receive alternating values. This causes all leases to be
  // invalidated repeatedly until only a single instance remains.
  //
  // A hash is used, as opposed to a list of incarnations, to ensure
  // that the size of requests is independent of the number of storage
  // servers in the cluster.
  bytes incarnations_hash = 2;

  // The incarnation of the storage server, as reported through
  // GetWatermarkResponse.incarnation, that the storage frontend expects
  // to process the request. If it does not match the incarnation of
  // the storage server, the request is rejected with
  // FAILED_PRECONDITION. The storage frontend is then expected to call
  // GetWatermark() to obtain the current incarnation of the storage
  // server, and retry the request.
  //
  // This ensures that leases are only handed out, stored and checked by
  // storage servers whose incarnation is accounted for by
  // incarnations_hash. Without it, a storage frontend that observed one
  // instance of a storage server could upload objects to another
  // instance that is running concurrently (e.g., during a rolling
  // upgrade), without incarnations_hash reflecting it.
  bytes expected_incarnation = 3;
}

// The input of the hash function that is used to compute
// LeaseValidationContext.incarnations_hash. The hash is computed over
// this message in serialized form, using deterministic serialization.
message IncarnationsHashInput {
  message Shard {
    // The name of the storage server, as used by storage frontends to
    // assign objects to storage servers.
    string name = 1;

    // The weight of the storage server, as used by storage frontends to
    // assign objects to storage servers.
    uint32 weight = 2;

    // The incarnation of the storage server, as reported through
    // GetWatermarkResponse.incarnation.
    bytes incarnation = 3;
  }

  // The storage servers in the cluster, sorted by name.
  //
  // As the names and weights of the storage servers determine how the
  // key space is partitioned, changing them causes objects to be
  // assigned to different storage servers. By including them, any
  // change to the layout of the key space causes all existing leases
  // to be invalidated.
  repeated Shard shards = 1;
}

message Limit {
  // The number of objects.
  uint32 count = 1;

  // The combined size of all objects.
  uint64 size_bytes = 2;
}
